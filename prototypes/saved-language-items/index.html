<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Zenbu saved material</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20251f;
      --muted: #687066;
      --paper: #f5f1e8;
      --surface: #fffdf8;
      --line: #ded8ca;
      --green: #315c48;
      --green-soft: #e0ece4;
      --amber: #e6a943;
      --red: #a64d43;
      --shadow: 0 18px 48px rgba(45, 39, 29, .15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(145deg, #ded8ca, #f7f3eb 55%, #dce5df);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      min-height: 100vh;
    }
    button { font: inherit; color: inherit; }
    .page {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(260px, 370px);
      gap: 28px;
      justify-content: center;
      align-items: start;
      padding: 28px 20px 110px;
    }
    .phone {
      min-height: 820px;
      overflow: hidden;
      background: var(--surface);
      border: 8px solid #282b27;
      border-radius: 42px;
      box-shadow: var(--shadow);
    }
    .status {
      display: flex;
      justify-content: space-between;
      padding: 14px 22px 8px;
      font-size: 12px;
      font-weight: 750;
    }
    .app { min-height: 780px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
    }
    .topbar h1 { margin: 0; font-size: 28px; letter-spacing: -.7px; }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: var(--green);
      color: white;
      font-size: 20px;
    }
    .search {
      margin: 4px 18px 14px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--muted);
      background: white;
    }
    .chips, .tabs { display: flex; gap: 8px; overflow: hidden; padding: 0 18px 14px; }
    .chip, .tab {
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
    }
    .chip.active, .tab.active { background: var(--green); color: white; border-color: var(--green); }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
    }
    .section-title span { color: var(--muted); font-size: 12px; font-weight: 600; }
    .feed { padding: 0 14px 90px; }
    .card {
      margin: 8px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      box-shadow: 0 2px 8px rgba(30, 35, 29, .04);
    }
    .row { display: flex; gap: 12px; align-items: flex-start; }
    .grow { flex: 1; min-width: 0; }
    .jp { font-size: 22px; font-weight: 800; }
    .meaning { margin-top: 2px; color: #424a41; font-size: 14px; }
    .meta { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .badge {
      display: inline-block;
      border-radius: 7px;
      padding: 4px 7px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 10px;
      font-weight: 800;
    }
    .thumb {
      width: 66px;
      height: 66px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: linear-gradient(145deg, #d7b28a, #7f947c);
      display: grid;
      place-items: center;
      color: white;
      font-size: 23px;
    }
    .bottom-nav {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 5px 14px;
      background: rgba(255,253,248,.96);
      border-top: 1px solid var(--line);
      border-radius: 0 0 32px 32px;
      font-size: 10px;
      text-align: center;
    }
    .bottom-nav div::before { display: block; margin-bottom: 4px; font-size: 18px; }
    .bottom-nav .lookup::before { content: "⌕"; }
    .bottom-nav .translate::before { content: "文"; }
    .bottom-nav .library::before { content: "▤"; }
    .bottom-nav .more::before { content: "•••"; }
    .bottom-nav .saved::before { content: "◇"; }
    .bottom-nav .active { color: var(--green); font-weight: 900; }
    .screen { position: relative; min-height: 780px; }

    /* Variant B */
    .lookup-header { padding: 12px 18px 0; background: #e8efe9; }
    .back { color: var(--green); font-weight: 800; }
    .list-layout { display: grid; grid-template-columns: 130px 1fr; min-height: 610px; border-top: 1px solid var(--line); }
    .sidebar { background: #f2f0e9; border-right: 1px solid var(--line); padding: 12px 8px; }
    .side-item { padding: 10px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .side-item.active { background: white; color: var(--green); box-shadow: 0 2px 7px rgba(30,35,29,.08); }
    .list-content { padding: 12px 10px 90px; }
    .compact { padding: 11px; }
    .compact .jp { font-size: 18px; }
    .segment { margin: 12px 18px; padding: 4px; background: #e8e5dc; border-radius: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .segment div { padding: 7px; text-align: center; font-size: 12px; font-weight: 800; border-radius: 8px; }
    .segment .active { background: white; box-shadow: 0 1px 4px rgba(30,35,29,.1); }

    /* Variant C */
    .notebook-cover { margin: 2px 16px 14px; padding: 18px; border-radius: 18px; background: #274d40; color: white; }
    .notebook-cover h2 { margin: 5px 0 2px; font-size: 23px; }
    .notebook-cover p { margin: 0; color: #d5e4db; font-size: 12px; }
    .paper { margin: 0 14px 90px; border-radius: 16px; background: #fffef9; border: 1px solid #ddd5c3; overflow: hidden; }
    .paper-row { position: relative; padding: 15px 15px 15px 48px; border-bottom: 1px solid #e5dece; }
    .paper-row:last-child { border-bottom: 0; }
    .paper-row::before { content: ""; position: absolute; left: 31px; top: 0; bottom: 0; border-left: 1px solid #e3a49d; }
    .paper-row .dot { position: absolute; left: 17px; top: 20px; width: 10px; height: 10px; border: 2px solid #849789; border-radius: 50%; background: white; }
    .source-thread { margin-top: 9px; padding: 9px; border-left: 3px solid var(--amber); background: #fbf4e5; border-radius: 0 9px 9px 0; font-size: 12px; }
    .notebooks { display: flex; gap: 8px; overflow: hidden; padding: 0 16px 12px; }
    .book { min-width: 112px; padding: 12px; border-radius: 12px; background: #e4ddd0; font-size: 12px; font-weight: 800; }
    .book.active { background: #e5b65d; }

    .decision-panel {
      position: sticky;
      top: 28px;
      background: rgba(255,253,248,.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .decision-panel h2 { margin: 4px 0 8px; font-size: 22px; }
    .decision-panel h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    .decision-panel p, .decision-panel li { color: #4f574e; font-size: 13px; line-height: 1.55; }
    .decision-panel ul { padding-left: 19px; }
    .verdict { padding: 12px; border-radius: 12px; background: var(--green-soft); color: #294d3d; font-weight: 750; }
    .prototype-switcher {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 44px minmax(190px, auto) 44px;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: #1f2420;
      color: white;
      box-shadow: 0 9px 28px rgba(0,0,0,.3);
    }
    .prototype-switcher button { height: 44px; border: 0; background: transparent; color: white; font-size: 19px; cursor: pointer; }
    .prototype-switcher button:hover { background: #343a34; }
    .prototype-label { padding: 0 12px; text-align: center; font-size: 12px; font-weight: 850; }
    .proto-mark { position: fixed; top: 10px; left: 10px; color: #494f48; font-size: 10px; font-weight: 900; letter-spacing: .08em; }
    @media (max-width: 820px) {
      .page { grid-template-columns: minmax(300px, 430px); padding: 18px 10px 130px; }
      .decision-panel { position: static; }
      .phone { min-height: 760px; }
      .proto-mark { display: none; }
    }
  </style>
</head>
<body>
  <div class="proto-mark">PROTOTYPE · ROUND 1 · NOT PRODUCTION</div>
  <main class="page">
    <section class="phone" aria-label="Mobile prototype">
      <div class="status"><span>9:41</span><span>● ● ▰</span></div>
      <div id="app" class="app"></div>
    </section>
    <aside id="decision" class="decision-panel"></aside>
  </main>
  <nav class="prototype-switcher" aria-label="Prototype variants">
    <button id="previous" aria-label="Previous variant">←</button>
    <div id="variant-label" class="prototype-label"></div>
    <button id="next" aria-label="Next variant">→</button>
  </nav>

  <script>
    const variants = ['A', 'B', 'C'];
    const content = {
      A: {
        name: 'Saved — unified destination',
        screen: `
          <div class="screen">
            <header class="topbar"><div><div class="eyebrow">Your Japanese</div><h1>Saved</h1></div><button class="circle">＋</button></header>
            <div class="search">⌕ Search words, phrases, or source text</div>
            <div class="tabs"><button class="tab active">Everything</button><button class="tab">Language</button><button class="tab">Images</button></div>
            <div class="chips"><button class="chip active">All tags</button><button class="chip">Food</button><button class="chip">Travel</button><button class="chip">Needs review</button></div>
            <div class="section-title">Recently saved <span>18 items</span></div>
            <div class="feed">
              <article class="card"><div class="row"><div class="grow"><span class="badge">WORD · 2 ENCOUNTERS</span><div class="jp">懐かしい</div><div class="meaning">nostalgic; fondly remembered</div><div class="meta">Seen yesterday in a message · Tagged “Daily life”</div></div><span>•••</span></div></article>
              <article class="card"><div class="row"><div class="thumb">駅</div><div class="grow"><span class="badge">IMAGE TEXT RESULT</span><div class="jp">次の電車は…</div><div class="meaning">The next train is…</div><div class="meta">Source image retained · 4 recognized regions · 1 language item saved separately</div></div></div></article>
              <article class="card"><div class="row"><div class="grow"><span class="badge">PHRASE · NEW ENCOUNTER</span><div class="jp">気をつけて</div><div class="meaning">Take care / Be careful</div><div class="meta">Saved once. This occurrence was attached instead of creating a duplicate.</div></div><span>•••</span></div></article>
            </div>
            <div class="bottom-nav"><div class="lookup">Lookup</div><div class="translate">Translate</div><div class="library">Media</div><div class="saved active">Saved</div></div>
          </div>`,
        panel: `
          <div class="eyebrow">Variant A</div><h2>One place for saved material</h2>
          <div class="verdict">Recommended starting model: “Saved” is an app-level destination, independent of Lookup history and Media Library.</div>
          <h3>Organization</h3><p>A flat library filtered by material type and lightweight tags. Search is primary; tags are optional. No folder hierarchy.</p>
          <h3>Save and duplicates</h3><p>Saving an existing language item adds an Encounter Example or updates tags; it does not create a second Saved Language Item. Image Text Results remain whole saved objects.</p>
          <h3>Lifecycle</h3><p>Deleting an Image Text Result removes its source and result. Encounter Examples explicitly saved from it survive, but their retained image attachment survives only if the learner explicitly attached it to that encounter.</p>
          <h3>Future Dojo</h3><p>Dojo reads eligible Saved Language Items through a shared contract; Saved does not become a study queue or Learning Profile.</p>`
      },
      B: {
        name: 'Lookup Bookmarks — named lists',
        screen: `
          <div class="screen">
            <div class="lookup-header"><div class="topbar" style="padding-left:0;padding-right:0"><div><div class="eyebrow">Lookup</div><h1>Bookmarks</h1></div><button class="circle">＋</button></div></div>
            <div class="segment"><div class="active">Language</div><div>Image results</div></div>
            <div class="search">⌕ Search bookmarks</div>
            <div class="list-layout">
              <nav class="sidebar"><div class="side-item active">All bookmarks<br><small>14</small></div><div class="side-item">Daily life<br><small>6</small></div><div class="side-item">Food<br><small>4</small></div><div class="side-item">Trip to Osaka<br><small>3</small></div><div class="side-item">Unfiled<br><small>1</small></div><div class="side-item">＋ New list</div></nav>
              <div class="list-content">
                <div class="eyebrow">All bookmarks</div>
                <article class="card compact"><div class="jp">懐かしい</div><div class="meaning">nostalgic</div><div class="meta">In 2 lists · 2 examples</div></article>
                <article class="card compact"><div class="jp">気をつけて</div><div class="meaning">take care</div><div class="meta">Daily life · 3 examples</div></article>
                <article class="card compact"><div class="jp">終電</div><div class="meaning">last train</div><div class="meta">Trip to Osaka · no personal example</div></article>
              </div>
            </div>
            <div class="bottom-nav"><div class="lookup active">Lookup</div><div class="translate">Translate</div><div class="library">Media</div><div class="more">More</div></div>
          </div>`,
        panel: `
          <div class="eyebrow">Variant B</div><h2>Lookup owns bookmarks</h2>
          <div class="verdict">A familiar dictionary model: named lists are strongest, but ownership makes saved material feel Lookup-specific.</div>
          <h3>Organization</h3><p>Saved Language Items are “Bookmarks” placed in zero or more named lists. Image Text Results occupy a coordinated tab, not the lists.</p>
          <h3>Save and duplicates</h3><p>The same language item has one bookmark record with multiple lists and Encounter Examples. Re-saving opens an “already bookmarked” sheet.</p>
          <h3>Lifecycle</h3><p>Deleting an image result never removes bookmarked language. Explicit encounter attachments are copied into the bookmark and survive; simple links back to the image disappear.</p>
          <h3>Future Dojo</h3><p>Dojo must depend on a cross-product saved-item contract even though Lookup owns the UI and records—an ownership tension this model does not hide.</p>`
      },
      C: {
        name: 'Notebook — encounter-first hybrid',
        screen: `
          <div class="screen">
            <header class="topbar"><div><div class="eyebrow">Your notebooks</div><h1>Notebook</h1></div><button class="circle">＋</button></header>
            <div class="notebooks"><div class="book active">Everyday finds<br><small>9 notes</small></div><div class="book">Osaka trip<br><small>5 notes</small></div><div class="book">Inbox<br><small>4 notes</small></div></div>
            <section class="notebook-cover"><div class="eyebrow" style="color:#c8d8cf">Notebook</div><h2>Everyday finds</h2><p>Words and moments worth returning to</p></section>
            <div class="chips"><button class="chip active">Timeline</button><button class="chip">Language index</button><button class="chip">Images</button></div>
            <div class="paper">
              <article class="paper-row"><span class="dot"></span><div class="jp">懐かしい</div><div class="meaning">nostalgic; fondly remembered</div><div class="source-thread">Yesterday · My friend described an old neighborhood photo.<br>“この感じ、懐かしいね”</div><div class="meta">One language item · 2 encounter notes</div></article>
              <article class="paper-row"><span class="dot"></span><div class="row"><div class="thumb">駅</div><div><span class="badge">SAVED IMAGE</span><div class="meaning">Station notice</div><div class="meta">4 recognized regions · 1 linked note</div></div></div></article>
              <article class="paper-row"><span class="dot"></span><div class="jp">気をつけて</div><div class="source-thread">Saved from a chat · “帰り、気をつけて”</div><div class="meta">Added to this notebook; matched an existing language item.</div></article>
            </div>
            <div class="bottom-nav"><div class="lookup">Lookup</div><div class="translate">Translate</div><div class="library">Media</div><div class="saved active">Notebook</div></div>
          </div>`,
        panel: `
          <div class="eyebrow">Variant C</div><h2>Organize by encounters</h2>
          <div class="verdict">The richest learning story: learner-named notebooks mix language and images, but risk becoming a general-purpose content store.</div>
          <h3>Organization</h3><p>Named notebooks are the primary browse model. A language index deduplicates Saved Language Items behind the encounter-first timeline.</p>
          <h3>Save and duplicates</h3><p>Every save becomes a note in a notebook. Matching language points to one underlying Saved Language Item; repeated occurrences become Encounter Examples.</p>
          <h3>Lifecycle</h3><p>Deleting an Image Text Result removes the whole-image note. Encounter notes explicitly extracted from it survive with any explicitly retained attachment.</p>
          <h3>Future Dojo</h3><p>Dojo can use the deduplicated language index and encounter evidence, while notebook membership remains optional context—not progress or a Learning Profile.</p>`
      }
    };

    function currentVariant() {
      const value = new URLSearchParams(location.search).get('variant')?.toUpperCase();
      return variants.includes(value) ? value : 'A';
    }
    function show(key) {
      document.getElementById('app').innerHTML = content[key].screen;
      document.getElementById('decision').innerHTML = content[key].panel;
      document.getElementById('variant-label').textContent = `${key} — ${content[key].name}`;
      document.title = `PROTOTYPE ${key} — ${content[key].name}`;
    }
    function cycle(direction) {
      const active = currentVariant();
      const next = variants[(variants.indexOf(active) + direction + variants.length) % variants.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', next);
      history.replaceState({}, '', url);
      show(next);
    }
    document.getElementById('previous').addEventListener('click', () => cycle(-1));
    document.getElementById('next').addEventListener('click', () => cycle(1));
    window.addEventListener('keydown', event => {
      const tag = event.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || event.target.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    window.addEventListener('popstate', () => show(currentVariant()));
    show(currentVariant());
  </script>
</body>
</html>
