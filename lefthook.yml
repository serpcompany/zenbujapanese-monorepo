extends:
  - node_modules/@serpcompany/verify/configs/lefthook.yml

pre-commit:
  parallel: true
  commands:
    web:
      root: apps/web/
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: pnpm --silent --filter zenbujapanese-web lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    dictionary-api:
      root: apps/dictionary-api/
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: pnpm --silent --filter zenbujapanese-dictionary-api lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    account-api:
      root: apps/account-api/
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: pnpm --silent --filter zenbujapanese-account-api lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    node-service:
      root: packages/node-service/
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: pnpm --silent --filter @zenbu/node-service lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    account-rules:
      root: packages/account-rules/
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: pnpm --silent --filter @zenbu/account-rules lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    dictionary-core:
      root: packages/dictionary-core/
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: pnpm --silent --filter @zenbu/dictionary-core lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    ui:
      root: packages/ui/
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: pnpm --silent --filter @zenbu/ui lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    checks:
      root: tools/checks/
      glob: "*.{ts,js,mjs,cjs,json,jsonc}"
      run: pnpm --silent --filter zenbujapanese-checks lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

pre-push:
  commands:
    web:
      skip:
        - run: git diff --quiet origin/main...HEAD -- apps/web packages/ui packages/dictionary-core packages/account-rules tools/checks/ports.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: >-
        pnpm --silent --filter zenbujapanese-web lint &&
        pnpm --silent --filter zenbujapanese-web typecheck &&
        pnpm --silent --filter zenbujapanese-web test
    dictionary-api:
      skip:
        - run: git diff --quiet origin/main...HEAD -- apps/dictionary-api packages/dictionary-core packages/node-service docs/api/dictionary-api.md package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: >-
        pnpm --silent --filter zenbujapanese-dictionary-api lint &&
        pnpm --silent --filter zenbujapanese-dictionary-api typecheck &&
        pnpm --silent --filter zenbujapanese-dictionary-api test --exclude "src/conformance/**"
    account-api:
      skip:
        - run: git diff --quiet origin/main...HEAD -- apps/account-api packages/account-rules packages/node-service docs/api/account-api.md package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: >-
        pnpm --silent --filter zenbujapanese-account-api lint &&
        pnpm --silent --filter zenbujapanese-account-api typecheck &&
        pnpm --silent --filter zenbujapanese-account-api db:check &&
        pnpm --silent --filter zenbujapanese-account-api test
    node-service:
      skip:
        - run: git diff --quiet origin/main...HEAD -- packages/node-service package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: pnpm --silent --filter @zenbu/node-service check
    account-rules:
      skip:
        - run: git diff --quiet origin/main...HEAD -- packages/account-rules package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: pnpm --silent --filter @zenbu/account-rules check
    dictionary-core:
      skip:
        - run: git diff --quiet origin/main...HEAD -- packages/dictionary-core package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: pnpm --silent --filter @zenbu/dictionary-core check
    ui:
      skip:
        - run: git diff --quiet origin/main...HEAD -- packages/ui packages/dictionary-core package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: pnpm --silent --filter @zenbu/ui check
    checks:
      skip:
        - run: git diff --quiet origin/main...HEAD -- tools/checks .github .claude deploy lefthook.yml verify.json package.json pnpm-lock.yaml pnpm-workspace.yaml
      run: pnpm --silent --filter zenbujapanese-checks check
