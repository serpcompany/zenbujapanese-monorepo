name: Weekly maintenance

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [all, doc-gardening, code-gardening, report]
        default: all

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  doc-gardening:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'doc-gardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip while the CLAUDE_CODE_OAUTH_TOKEN secret isn't set
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so the docs aren't gardened (docs/agents/ci.md, Weekly maintenance)."

      - uses: actions/checkout@v5
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v5
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install every package
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the maintenance report
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: mkdir -p tmp && pnpm -s maintenance:report > tmp/maintenance-report.md

      - name: Note when doc gardening starts
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: echo "GARDENING_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Garden the docs with Claude
        id: garden
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "900000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are this repository's weekly doc gardener. Follow AGENTS.md and docs/agents/code.md.
            Goal: docs and quality grades that no longer match the code are fixed in one small
            pull request.

            0. First run `gh pr list --state open --search "Weekly doc gardening in:title"`. If it
               lists a pull request, stop and say that a gardening pull request is already open,
               with its number.
            1. Read tmp/maintenance-report.md. Your work list is the "Checks" failures that are
               about docs, the "Docs to re-verify" list, and the rows under "Scores to re-grade".
               Handle at most 8 docs, starting with the ones whose referenced files changed most.
            2. For each doc, read it and the code it describes. Fix what is no longer true and
               remove what no longer exists. Keep the doc's structure and its plain, specific
               style. If a doc is still accurate, change nothing in it.
            3. Re-grade each row listed under "Scores to re-grade" in docs/quality.md. Read the
               code in its Code column, with its tests, CI, and docs, and grade it again on the
               scale at the top of that file. Rewrite the row and its line under the table (the
               evidence and the main gap) to match the code as it is now, and link each gap to its
               issue or to the row of docs/tech-debt.md that covers it (add a row there, with a
               Size, when none does). Set the row's Graded date to today (UTC), even when its
               grade stays the same. Change no other row. Remove rows of docs/tech-debt.md whose
               debt the code has paid off.
            4. Edit only Markdown: AGENTS.md, ARCHITECTURE.md, README.md files, docs/ except
               docs/adr/ (ADRs record decisions; never rewrite them), apps/*/docs/, and
               .claude/skills/. Never touch code, tests, workflows, or anything a tool generates.
            5. Run `pnpm -s verify docs`; it must pass.
            6. If you changed nothing, stop and say "No doc drift found". Otherwise create the
               branch docs/gardening-<YYYY-MM-DD>, commit with the message "Bring the docs back in
               line with the code", push it, and open a pull request into main titled "Weekly doc
               gardening (<YYYY-MM-DD>)". Write its body to tmp/pr-body.md first and pass it with
               `--body-file tmp/pr-body.md`: each doc you changed, what was wrong, and the code
               you checked it against; each row you re-graded, with its old and new grade and
               why; then the docs you checked without changes.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --strict-mcp-config
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(pnpm -s verify docs),Bash(date:*)"

      - name: Keep the doc gardening transcript
        if: always() && env.HAS_CLAUDE_TOKEN == 'true' && steps.garden.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: doc-gardening-transcript
          path: ${{ steps.garden.outputs.execution_file }}
          retention-days: 7
          overwrite: true

      - name: Fail unless doc gardening finished
        if: env.HAS_CLAUDE_TOKEN == 'true'
        env:
          EXECUTION_FILE: ${{ steps.garden.outputs.execution_file }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const clean = (value, max = 120) => String(value).replace(/[\r\n%]+/g, ' ').slice(0, max)
          const fail = message => {
            console.log(`::error title=Doc gardening didn't finish::${clean(message, 900)}`)
            process.exit(1)
          }
          const readResult = () => {
            const file = process.env.EXECUTION_FILE
            if (!file || !fs.existsSync(file)) fail('Doc gardening wrote no execution log.')
            let messages
            try {
              messages = JSON.parse(fs.readFileSync(file, 'utf8'))
            } catch (error) {
              fail(`The execution log isn't JSON: ${error.message}`)
            }
            if (!Array.isArray(messages)) fail("The execution log isn't a list of messages.")
            const result = messages.filter(entry => entry?.type === 'result').at(-1)
            if (!result) fail('The execution log has no result.')
            return { messages, result }
          }
          const openGardeningPrs = async () => {
            const api = `${process.env.GITHUB_API_URL || 'https://api.github.com'}/repos/${process.env.GITHUB_REPOSITORY}`
            const response = await fetch(`${api}/pulls?state=open&base=main&per_page=100`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            })
            if (!response.ok) throw new Error(`GET /pulls returned ${response.status}`)
            return (await response.json()).filter(pr => String(pr?.head?.ref).startsWith('docs/gardening-'))
          }
          const main = async () => {
            const { messages, result } = readResult()
            const said = String(result.result || '')
            console.log(`Doc gardening: ${result.num_turns} turns, about $${Number(result.total_cost_usd || 0).toFixed(2)}. Claude said: ${clean(said || '(nothing)', 400)}`)
            if (result.is_error) fail(`Doc gardening ended with ${result.subtype || 'an error'}.`)
            const sets = messages.filter(entry => entry?.type === 'system' && entry.subtype === 'background_tasks_changed')
            const running = (sets.at(-1)?.tasks || []).filter(task => task && !task.ambient)
            if (running.length) fail(`Doc gardening ended with ${running.length} background task(s) still running.`)
            const denied = [...new Set((result.permission_denials || []).map(denial =>
              denial?.tool_input?.command ? `${denial.tool_name} (${clean(denial.tool_input.command)})` : String(denial?.tool_name)
            ))]
            const startedAt = Date.parse(process.env.GARDENING_STARTED_AT || '')
            if (Number.isNaN(startedAt)) fail("GARDENING_STARTED_AT isn't set, so the check can't tell whether this run opened a pull request.")
            let prs
            try {
              prs = await openGardeningPrs()
            } catch (error) {
              fail(`Couldn't list the open pull requests to check the outcome: ${error.message}`)
            }
            const opened = prs.filter(pr => Date.parse(pr.created_at) >= startedAt - 30 * 1000)
            let outcome = null
            if (opened.length > 0) outcome = `opened ${opened.map(pr => `#${pr.number}`).join(', ')}`
            else if (/No doc drift found/i.test(said)) outcome = 'found no doc drift'
            else if (prs.length > 0 && /already/i.test(said)) outcome = `left the open gardening pull request #${prs[0].number} alone`
            if (!outcome) {
              const reason = denied.length > 0 ? ` Claude was denied ${denied.join(', ')}; allow it in claude_args.` : ''
              fail(`Doc gardening finished without opening a pull request or reporting "No doc drift found".${reason}`)
            }
            if (denied.length > 0) {
              console.log(`::warning title=Doc gardening was denied tools::Claude was denied ${clean(denied.join(', '), 600)} but still ${outcome}. Allow it in claude_args if the job needs it.`)
            }
            console.log(`Doc gardening ${outcome}.`)
          }
          main().catch(error => fail(`The doc gardening check failed: ${error?.message}`))

  code-gardening:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'code-gardening'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip this week unless there's room for a gardening pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_CLAUDE_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so no code is gardened (docs/agents/ci.md, Weekly maintenance)."
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("chore/code-gardening-")) | .number] | first // empty')
          if [ -n "$open" ]; then
            echo "::notice::Code gardening pull request #$open is still open, so code gardening skips this week."
            exit 0
          fi
          echo "GARDEN=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        if: env.GARDEN == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        if: env.GARDEN == 'true'
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v5
        if: env.GARDEN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install every package
        if: env.GARDEN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the maintenance report
        if: env.GARDEN == 'true'
        run: mkdir -p tmp && pnpm -s maintenance:report > tmp/maintenance-report.md

      - name: Note when code gardening starts
        if: env.GARDEN == 'true'
        run: echo "GARDENING_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Garden the code with Claude
        id: garden
        if: env.GARDEN == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "900000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are this repository's weekly code gardener. Follow AGENTS.md, ARCHITECTURE.md,
            docs/agents/code.md, and CONTEXT.md.
            Goal: one small piece of known debt is paid down in one small pull request into main.

            1. Read tmp/maintenance-report.md and pick ONE item:
               a. the first row of docs/tech-debt.md whose Size is `small`, reading its tables
                  from the top (the report names it under "Known debt"); or, when there is none
                  or you must pass over it,
               b. one file under "Files near the size limit" in the report, split by
                  responsibility so it stays well under the limit.
               Pass over an item that needs a deploy, a language-data release or anything in R2,
               a change under apps/ios or in Swift (this runner can't build or test it), a change
               to the behavior or wording a product doc describes, an ADR-level decision
               (docs/agents/domain.md), or another decision AGENTS.md leaves to a person, and
               take the next one. If nothing qualifies, stop and say "Nothing to garden".
            2. Fix that item and nothing else, the way its row says, in as few lines as it needs.
               Update the tests and docs that describe the code you change. Write no code
               comments.
            3. If the item is a row of docs/tech-debt.md, delete the row. If the fix shows debt
               you didn't fix, add a row for it, with a Size.
            4. Run `pnpm check` and fix what it reports. If it still fails, stop and say
               "Gardening failed:" with what fails, and open no pull request.
            5. Create the branch chore/code-gardening-<YYYY-MM-DD> from the current HEAD. Commit
               with a message whose first line says what changed in a plain sentence and cites
               the row's issue, such as "Split the website guide by task (#516)". Push the
               branch and open a pull request into main with that line as its title. Write its
               body to tmp/pr-body.md first and pass it with `--body-file tmp/pr-body.md`: the
               item and why you picked it, what you changed, and the last lines of `pnpm check`.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --strict-mcp-config
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(pnpm check),Bash(date:*)"

      - name: Keep the code gardening transcript
        if: always() && env.GARDEN == 'true' && steps.garden.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: code-gardening-transcript
          path: ${{ steps.garden.outputs.execution_file }}
          retention-days: 7
          overwrite: true

      - name: Fail unless code gardening opened one pull request or found nothing to garden
        if: env.GARDEN == 'true'
        env:
          EXECUTION_FILE: ${{ steps.garden.outputs.execution_file }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const clean = (value, max = 120) => String(value).replace(/[\r\n%]+/g, ' ').slice(0, max)
          const fail = message => {
            console.log(`::error title=Code gardening didn't finish::${clean(message, 900)}`)
            process.exit(1)
          }
          const readResult = () => {
            const file = process.env.EXECUTION_FILE
            if (!file || !fs.existsSync(file)) fail('Code gardening wrote no execution log.')
            let messages
            try {
              messages = JSON.parse(fs.readFileSync(file, 'utf8'))
            } catch (error) {
              fail(`The execution log isn't JSON: ${error.message}`)
            }
            if (!Array.isArray(messages)) fail("The execution log isn't a list of messages.")
            const result = messages.filter(entry => entry?.type === 'result').at(-1)
            if (!result) fail('The execution log has no result.')
            return { messages, result }
          }
          const openGardeningPrs = async () => {
            const api = `${process.env.GITHUB_API_URL || 'https://api.github.com'}/repos/${process.env.GITHUB_REPOSITORY}`
            const response = await fetch(`${api}/pulls?state=open&base=main&per_page=100`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            })
            if (!response.ok) throw new Error(`GET /pulls returned ${response.status}`)
            return (await response.json()).filter(pr => String(pr?.head?.ref).startsWith('chore/code-gardening-'))
          }
          const main = async () => {
            const { messages, result } = readResult()
            const said = String(result.result || '')
            console.log(`Code gardening: ${result.num_turns} turns in ${Math.round((result.duration_ms || 0) / 1000)}s, about $${Number(result.total_cost_usd || 0).toFixed(2)}. Claude said: ${clean(said || '(nothing)', 400)}`)
            if (result.is_error) fail(`Code gardening ended with ${result.subtype || 'an error'}.`)
            const sets = messages.filter(entry => entry?.type === 'system' && entry.subtype === 'background_tasks_changed')
            const running = (sets.at(-1)?.tasks || []).filter(task => task && !task.ambient)
            if (running.length) fail(`Code gardening ended with ${running.length} background task(s) still running.`)
            const denied = [...new Set((result.permission_denials || []).map(denial =>
              denial?.tool_input?.command ? `${denial.tool_name} (${clean(denial.tool_input.command)})` : String(denial?.tool_name)
            ))]
            const startedAt = Date.parse(process.env.GARDENING_STARTED_AT || '')
            if (Number.isNaN(startedAt)) fail("GARDENING_STARTED_AT isn't set, so the check can't tell whether this run opened a pull request.")
            let opened
            try {
              opened = (await openGardeningPrs()).filter(pr => Date.parse(pr.created_at) >= startedAt - 30 * 1000)
            } catch (error) {
              fail(`Couldn't list the open pull requests to check the outcome: ${error.message}`)
            }
            if (opened.length > 1) {
              fail(`Code gardening opened ${opened.map(pr => `#${pr.number}`).join(', ')}; it fixes one item in one pull request each week.`)
            }
            let outcome = null
            if (opened.length === 1) outcome = `opened #${opened[0].number}: ${clean(opened[0].title, 200)}`
            else if (/Nothing to garden/i.test(said)) outcome = 'found nothing to garden'
            if (!outcome) {
              const reason = denied.length > 0 ? ` Claude was denied ${denied.join(', ')}; allow it in claude_args.` : ''
              fail(`Code gardening finished without opening a pull request or reporting "Nothing to garden".${reason} Claude said: ${clean(said || '(nothing)', 400)}`)
            }
            if (denied.length > 0) {
              console.log(`::warning title=Code gardening was denied tools::Claude was denied ${clean(denied.join(', '), 600)} but still ${outcome}. Allow it in claude_args if the job needs it.`)
            }
            console.log(`Code gardening ${outcome}.`)
          }
          main().catch(error => fail(`The code gardening check failed: ${error?.message}`))

  report:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Weekly repository maintenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install every package
        run: pnpm install --frozen-lockfile

      - name: Build the maintenance report
        run: mkdir -p tmp && pnpm -s maintenance:report > tmp/weekly-report.md

      - name: Open or update the maintenance issue
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file tmp/weekly-report.md
            gh issue comment "$number" --body "Report refreshed on $(date -u +%F)."
          else
            gh issue create --title "$TITLE" --body-file tmp/weekly-report.md --label ready-for-agent
          fi
