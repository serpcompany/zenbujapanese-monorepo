name: iOS

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  LFS_FILES: apps/ios/**,language-data/sources/**
  LFS_RECORDINGS: apps/ios/Tools/TranslateReplay/Recordings/**
  LFS_SNAPSHOTS: language-data/sources/JMdict_e_examp-*.gz,language-data/sources/Tatoeba-*/*,language-data/sources/KANJIDIC2-*/*,language-data/sources/EDRDG-radicals-*/*,language-data/sources/Kanji-JLPT-Waller-*/*

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: paths
        uses: ./.github/actions/changed-paths
        with:
          paths: >-
            apps/ios packages/account-rules/cases .xcode-version
            language-data/sources language-data/generated language-data/conformance
            language-data/tools .python-version .github/workflows/ios.yml
            .github/actions/changed-paths .node-version
            packages/dictionary-core/scripts/romaji-search-forms.mjs
            packages/dictionary-core/src/detail/romaji.ts packages/dictionary-core/src/detail/text.ts
            packages/dictionary-core/src/examples/kana.ts packages/dictionary-core/src/search/query.ts
            packages/dictionary-core/src/search/romaji-forms.ts

  contracts:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Restore the Git LFS files
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .git/lfs/objects
          key: lfs-ios-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/*.dat.gz', 'language-data/sources/*.xz', 'language-data/sources/*/*.xz') }}
      - name: Fetch the Git LFS files
        run: git lfs pull --include="$LFS_FILES" --exclude="$LFS_SNAPSHOTS,$LFS_RECORDINGS"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run the data tools' contract tests
        run: python3 -m unittest discover --start-directory language-data/tools/tests --pattern 'test_*.py' --verbose
      - name: Run the tests of the app's project settings and Simulator script
        run: python3 -m unittest discover --start-directory apps/ios/Tools/tests --pattern 'test_*.py' --verbose

  swift:
    needs: [changes, contracts]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.IOS_SWIFT_TESTS == 'on' && needs.changes.outputs.changed == 'true')
    runs-on: macos-26
    timeout-minutes: 240
    env:
      TEST_RUNNER_OS_ACTIVITY_DT_MODE: "NO"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Make the folder the results are kept in
        run: mkdir -p "$RUNNER_TEMP/ios-results"
      - name: Select the pinned Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: Restore the Git LFS files
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .git/lfs/objects
          key: lfs-ios-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/*.dat.gz', 'language-data/sources/*.xz', 'language-data/sources/*/*.xz') }}
      - name: Fetch the Git LFS files
        run: git lfs pull --include="$LFS_FILES" --exclude="$LFS_SNAPSHOTS,$LFS_RECORDINGS"
      - name: Make the app's iPhone and iPad Simulators
        run: |
          xcodebuild -version
          simulator=$(python3 apps/ios/Tools/simulator.py)
          ipad=$(python3 apps/ios/Tools/simulator.py --device ipad)
          printf 'SIMULATOR=%s\nIPAD_SIMULATOR=%s\n' "$simulator" "$ipad" >>"$GITHUB_ENV"
      - name: Restore the Sudachi build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/Library/Caches/com.zenbujapanese.build/SudachiCore
          key: sudachi-core-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json') }}
      - name: Fill the Sudachi build cache
        run: |
          python3 apps/ios/Tools/prepare_sudachi_core.py \
            --manifest apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json \
            --cache "$HOME/Library/Caches/com.zenbujapanese.build/SudachiCore" --cache-only
      - name: Run SearchExperienceTests and TranslatorCoreTests on the iPhone Simulator
        working-directory: apps/ios/Modules
        run: |
          xcodebuild -scheme ZenbuJapaneseModules-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/ios-results/package-iphone.xcresult" \
            ONLY_ACTIVE_ARCH=YES test 2>&1 | tee "$RUNNER_TEMP/ios-results/package-iphone.log"
      - name: Run SearchExperienceTests and TranslatorCoreTests on the iPad Simulator
        working-directory: apps/ios/Modules
        run: |
          xcodebuild -scheme ZenbuJapaneseModules-Package \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/ios-results/package-ipad.xcresult" \
            ONLY_ACTIVE_ARCH=YES test 2>&1 | tee "$RUNNER_TEMP/ios-results/package-ipad.log"
      - name: Run SearchExperienceTests and TranslatorCoreTests on the Mac
        working-directory: apps/ios/Modules
        run: |
          xcodebuild -scheme ZenbuJapaneseModules-Package \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/ios-results/package-mac.xcresult" \
            test 2>&1 | tee "$RUNNER_TEMP/ios-results/package-mac.log"
      - name: Run the app's UI tests on the iPhone Simulator
        run: |
          xcodebuild -project apps/ios/ZenbuJapanese.xcodeproj -scheme ZenbuJapanese \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/ios-results/ui-iphone.xcresult" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 ZENBU_BUNDLE_ID_SUFFIX=.uitests test 2>&1 \
            | tee "$RUNNER_TEMP/ios-results/ui-iphone.log"
      - name: Run the app's UI tests on the iPad Simulator
        run: |
          xcodebuild -project apps/ios/ZenbuJapanese.xcodeproj -scheme ZenbuJapanese \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/ios-results/ui-ipad.xcresult" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 ZENBU_BUNDLE_ID_SUFFIX=.uitests test 2>&1 \
            | tee "$RUNNER_TEMP/ios-results/ui-ipad.log"
      - name: Let UI tests drive the Mac
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Run the app's UI tests on the Mac
        run: |
          xcodebuild -project apps/ios/ZenbuJapanese.xcodeproj -scheme ZenbuJapanese \
            -destination 'platform=macOS,arch=arm64' ZENBU_BUNDLE_ID_SUFFIX=.uitests \
            -resultBundlePath "$RUNNER_TEMP/ios-results/ui-mac.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= test 2>&1 \
            | tee "$RUNNER_TEMP/ios-results/ui-mac.log"
      - name: Run the recorded-audio check's scoring tests
        working-directory: apps/ios/Tools/TranslateReplay
        run: swift test 2>&1 | tee "$RUNNER_TEMP/ios-results/translate-replay-scoring.log"
      - name: Keep the result bundles and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-results
          path: ${{ runner.temp }}/ios-results
          retention-days: 7

  ios:
    if: always()
    needs: [changes, contracts, swift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
