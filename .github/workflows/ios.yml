name: iOS

on:
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LFS_FILES: apps/ios/**
  LFS_RECORDINGS: apps/ios/Tools/TranslateReplay/Recordings/**
  LFS_SNAPSHOTS: apps/ios/LanguageData/Sources/JMdict_e-*.gz,apps/ios/LanguageData/Sources/Tatoeba-*/*,apps/ios/LanguageData/Sources/KANJIDIC2-*/*,apps/ios/LanguageData/Sources/EDRDG-radicals-*/*,apps/ios/LanguageData/Sources/Kanji-JLPT-Waller-*/*

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Restore the Git LFS files
        uses: actions/cache@v5
        with:
          path: .git/lfs/objects
          key: lfs-ios-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/*.dat.gz', 'apps/ios/LanguageData/Sources/*.xz', 'apps/ios/LanguageData/Sources/*/*.xz') }}
      - name: Fetch the Git LFS files
        run: git lfs pull --include="$LFS_FILES" --exclude="$LFS_SNAPSHOTS,$LFS_RECORDINGS"
      - name: Run the data tools' contract tests
        run: python3 -m unittest discover --start-directory apps/ios/Tools/tests --pattern 'test_*.py' --verbose

  swift:
    if: ${{ vars.IOS_SWIFT_TESTS == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Restore the Git LFS files
        uses: actions/cache@v5
        with:
          path: .git/lfs/objects
          key: lfs-ios-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/*.dat.gz', 'apps/ios/LanguageData/Sources/*.xz', 'apps/ios/LanguageData/Sources/*/*.xz') }}
      - name: Fetch the Git LFS files
        run: git lfs pull --include="$LFS_FILES" --exclude="$LFS_SNAPSHOTS,$LFS_RECORDINGS"
      - name: Pick the first iPhone and iPad Simulators on the newest iOS runtime
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (runtime for runtime in devices if ".SimRuntime.iOS-" in runtime),
              key=lambda runtime: [int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")],
          )
          for runtime in reversed(runtimes):
              phones = [device for device in devices[runtime] if device["name"].startswith("iPhone")]
              pads = [device for device in devices[runtime] if device["name"].startswith("iPad")]
              if phones and pads:
                  print("SIMULATOR=" + phones[0]["udid"])
                  print("IPAD_SIMULATOR=" + pads[0]["udid"])
                  break
          else:
              sys.exit("No iOS runtime has both an iPhone and an iPad Simulator")
          ' >>"$GITHUB_ENV"
      - name: Run SearchExperienceTests and TranslatorCoreTests on the iPhone Simulator
        working-directory: apps/ios/Modules
        run: |
          xcodebuild -scheme ZenbuJapaneseModules-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            ONLY_ACTIVE_ARCH=YES test
      - name: Run SearchExperienceTests and TranslatorCoreTests on the iPad Simulator
        working-directory: apps/ios/Modules
        run: |
          xcodebuild -scheme ZenbuJapaneseModules-Package \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            ONLY_ACTIVE_ARCH=YES test
      - name: Run SearchExperienceTests and TranslatorCoreTests on the Mac
        working-directory: apps/ios/Modules
        run: |
          xcodebuild -scheme ZenbuJapaneseModules-Package \
            -destination 'platform=macOS,arch=arm64' test
      - name: Restore the Sudachi build cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/com.zenbujapanese.build/SudachiCore
          key: sudachi-core-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json') }}
      - name: Fill the Sudachi build cache
        run: |
          python3 apps/ios/Tools/prepare_sudachi_core.py \
            --manifest apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json \
            --cache "$HOME/Library/Caches/com.zenbujapanese.build/SudachiCore" --cache-only
      - name: Run the app's UI tests on the iPhone Simulator
        run: |
          xcodebuild -project apps/ios/ZenbuJapanese.xcodeproj -scheme ZenbuJapanese \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 ZENBU_BUNDLE_ID_SUFFIX=.uitests \
            CODE_SIGNING_ALLOWED=NO test
      - name: Run the app's UI tests on the iPad Simulator
        run: |
          xcodebuild -project apps/ios/ZenbuJapanese.xcodeproj -scheme ZenbuJapanese \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 ZENBU_BUNDLE_ID_SUFFIX=.uitests \
            CODE_SIGNING_ALLOWED=NO test
      - name: Let UI tests drive the Mac
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Run the app's UI tests on the Mac
        run: |
          xcodebuild -project apps/ios/ZenbuJapanese.xcodeproj -scheme ZenbuJapanese \
            -destination 'platform=macOS,arch=arm64' ZENBU_BUNDLE_ID_SUFFIX=.uitests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= test
      - name: Run the recorded-audio check's scoring tests
        working-directory: apps/ios/Tools/TranslateReplay
        run: swift test
