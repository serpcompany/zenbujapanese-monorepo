name: Doc gardening

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: doc-gardening
  cancel-in-progress: false

jobs:
  garden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip while the CLAUDE_CODE_OAUTH_TOKEN secret isn't set
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so the docs aren't gardened (docs/agents/ci.md, Doc gardening)."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the repository checks
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: pnpm install --frozen-lockfile --filter zenbujapanese-checks

      - name: Garden the docs with Claude
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are this repository's weekly doc gardener. Follow AGENTS.md and docs/agents/code.md.
            Goal: docs that no longer match the code are fixed in one small pull request.

            1. List the files that changed on main in the last 7 days:
               `git log --since="7 days ago" --name-only --format= | sort -u`.
            2. Find the docs that describe them: the doc AGENTS.md routes to for each changed
               area, and every doc that names a changed file (`git grep -l <path> -- '*.md'`).
               Take at most 8, starting with the ones whose code changed most.
            3. For each, read it and the code it describes. Fix what is no longer true and remove
               what no longer exists. Keep the doc's structure and its plain, specific style. If
               a doc is still accurate, change nothing in it.
            4. Update docs/quality.md where the week changed an area's tests, CI, or docs, and
               docs/tech-debt.md where it paid off or added known debt.
            5. Edit only Markdown: AGENTS.md, ARCHITECTURE.md, README.md files, docs/ except
               docs/adr/ (ADRs record decisions; never rewrite them), and apps/*/docs/. Never touch code, tests,
               workflows, or anything a tool generates.
            6. Run `pnpm -s verify docs`; it must pass.
            7. If you changed nothing, stop and say "No doc drift found". Otherwise, unless
               `gh pr list --state open --search "Weekly doc gardening in:title"` already lists
               one (then stop and say so): create the branch docs/gardening-<YYYY-MM-DD>, commit
               with the message "Bring the docs back in line with the code", push it, and open a
               pull request into main titled "Weekly doc gardening (<YYYY-MM-DD>)". Its body lists
               each doc you changed, what was wrong, and the code you checked it against, then
               the docs you checked without changes.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(pnpm -s verify docs),Bash(date:*),Bash(sort:*)"
