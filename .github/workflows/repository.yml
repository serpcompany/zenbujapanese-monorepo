name: Repository

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The checks' own lint, typecheck, and tests
        run: pnpm --filter zenbujapanese-checks check
      - name: No comments, docs, sizes, secrets, duplicates, dead code, import rules, and the pinned linters
        run: pnpm verify
      - name: A fix/ branch changes a test
        if: startsWith(github.head_ref, 'fix/')
        env:
          BRANCH: ${{ github.head_ref }}
        run: pnpm --silent --filter zenbujapanese-checks fix-branch "$BRANCH" HEAD^1
