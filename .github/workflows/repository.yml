name: Repository

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The checks' own lint, typecheck, and tests
        run: pnpm --filter zenbujapanese-checks check
      - name: No comments, docs, sizes, secrets, duplicates, dead code, import rules, and the pinned linters
        run: pnpm verify
