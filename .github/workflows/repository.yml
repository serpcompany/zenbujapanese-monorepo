name: Repository

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: No account migration drops or renames what the code on the base reads
        run: node tools/checks/migrations.mjs HEAD^1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - name: Install every package, with @serpcompany/verify from GitHub Packages
        id: install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Say what installing the private package needs
        if: failure() && steps.install.outcome == 'failure'
        run: >-
          echo "::error title=@serpcompany/verify is a private GitHub Package::This job grants
          packages: read, and the package's settings must give this repository Read under Manage
          Actions access (docs/agents/checks.md, In CI)."
      - name: The checks' own lint, typecheck, and tests
        run: pnpm --filter zenbujapanese-checks check
      - name: The shared checks, at the version the lockfile pins
        env:
          SERP_VERIFY_BASE: HEAD^1
        run: pnpm verify
