name: Repository

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter zenbujapanese-checks
      - name: The checks' own lint, typecheck, and tests
        run: pnpm --filter zenbujapanese-checks check
      - name: No comments, docs, file sizes, and the pinned linters in Docker
        run: pnpm verify
