name: Release database

# Imports and verifies one release database (search or dictionary) for this commit in one
# environment (issue 464): scripts/release-d1/ensure-release.sh. `Web deploy` runs the same
# script for staging before each deploy; this runs it by hand, for either environment. Reuses the
# database when it already verifies, so a second run only checks it. It never deletes other
# builds' databases: Web deploy prunes them after a successful deploy. Its concurrency group is
# shared with Web deploy's staging job, so two staging imports never overlap.
on:
  workflow_dispatch:
    inputs:
      database:
        description: Release database to import
        type: choice
        options: [search, dictionary]
        default: search
      environment:
        description: Environment to import it for
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: release-database-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    # A new search build is about 45 minutes (docs/agents/web.md).
    timeout-minutes: 75
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE: ${{ inputs.database }}
      ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Import and verify
        run: scripts/release-d1/ensure-release.sh "$DATABASE" "$ENVIRONMENT" | tee -a "$GITHUB_STEP_SUMMARY"
