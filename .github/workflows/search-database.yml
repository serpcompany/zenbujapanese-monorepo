name: Search database

# Imports and verifies the dictionary search database for this commit in one environment
# (issue 464): scripts/search-d1/ensure-release.sh. Run by hand for now; `Web deploy` will run it
# before each deploy once it has run cleanly here. Reuses the database when it already verifies,
# so a second run only checks it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose search database to import
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: search-database-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Import and verify
        run: scripts/search-d1/ensure-release.sh "${{ inputs.environment }}" | tee -a "$GITHUB_STEP_SUMMARY"
