name: Search database

# Imports and verifies the dictionary search database for this commit in one environment
# (issue 464): scripts/search-d1/ensure-release.sh. `Web deploy` runs the same script for staging
# before each deploy; this runs it by hand, for either environment. Reuses the database when it
# already verifies, so a second run only checks it. It never deletes other builds' databases:
# Web deploy prunes them after a successful deploy. Its concurrency group is shared with Web
# deploy's staging job, so two staging imports never overlap.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose search database to import
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: search-database-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Import and verify
        run: scripts/search-d1/ensure-release.sh "${{ inputs.environment }}" | tee -a "$GITHUB_STEP_SUMMARY"
