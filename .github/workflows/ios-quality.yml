name: iOS quality

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_failure:
        description: Deliberately fail repo-contracts to verify enforcement
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-contracts:
    name: repo-contracts
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out exact source and LFS data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: true

      - name: Install audit tooling
        run: brew install ripgrep

      - name: Verify committed test plans
        run: |
          set -euo pipefail
          for plan in apps/ios/TestPlans/*.xctestplan; do
            jq empty "$plan"
          done
          xmllint --noout apps/ios/ZenbuJapanese.xcodeproj/xcshareddata/xcschemes/ZenbuJapanese.xcscheme
          rg -q 'ZenbuPR.xctestplan' apps/ios/ZenbuJapanese.xcodeproj/xcshareddata/xcschemes/ZenbuJapanese.xcscheme

      - name: Run importer and validator tests
        run: python3 -m unittest discover apps/ios/Tools/Tests -p 'test_*.py'

      - name: Run release-audit harness
        run: bash apps/ios/Tools/Tests/audit-release-privacy.test.sh

      - name: Run source privacy and bundled-data audit
        run: bash apps/ios/Tools/audit_release_privacy.sh source

      - name: Prove required-check failure path
        if: ${{ inputs.prove_failure }}
        run: |
          echo 'Intentional repo-contracts failure proof'
          exit 1

  ios-pr:
    name: ios-pr / ZenbuPR
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out exact source and LFS data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: true

      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Run complete PR plan
        run: |
          apps/ios/Tools/run_ci_test_plan.sh \
            ZenbuPR \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max \
            "$RUNNER_TEMP/ZenbuPR.xcresult"

      - name: Package test evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/ZenbuPR.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/ZenbuPR.xcresult" "$RUNNER_TEMP/ZenbuPR.xcresult.zip"
          fi

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ZenbuPR-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZenbuPR.xcresult.zip
          if-no-files-found: warn
          retention-days: 30
