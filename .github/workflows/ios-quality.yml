name: iOS fast quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_failure:
        description: Deliberately fail repository contracts to verify enforcement
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: ios-fast / Scope
    runs-on: ubuntu-24.04
    outputs:
      ios_changed: ${{ steps.scope.outputs.ios_changed }}
    steps:
      - name: Check out enough history to classify the change
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Classify iOS impact
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_IOS: ${{ github.event_name == 'workflow_dispatch' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 apps/ios/Tools/ios_ci_scope.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --force "$FORCE_IOS" \
            --github-output "$GITHUB_OUTPUT"

  repo-contracts:
    name: ios-fast / Repository contracts
    needs: scope
    if: ${{ needs.scope.outputs.ios_changed == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out exact source and LFS data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: true

      - name: Install audit tooling
        run: |
          brew install actionlint ripgrep
          gem install sqlite3 --version 2.9.6 --platform ruby --no-document -- \
            --enable-system-libraries
          ruby -e 'require "sqlite3"; abort "FTS4 unavailable" unless SQLite3::Database.new(":memory:").execute("PRAGMA compile_options").flatten.include?("ENABLE_FTS4")'

      - name: Verify workflow and test-plan contracts
        run: |
          set -euo pipefail
          actionlint
          for plan in apps/ios/TestPlans/*.xctestplan; do
            jq empty "$plan"
          done
          xmllint --noout apps/ios/ZenbuJapanese.xcodeproj/xcshareddata/xcschemes/ZenbuJapanese.xcscheme
          rg -q 'ZenbuPR.xctestplan' apps/ios/ZenbuJapanese.xcodeproj/xcshareddata/xcschemes/ZenbuJapanese.xcscheme
          python3 -m unittest apps/ios/Tools/Tests/test_ios_ci_scope.py

      - name: Run importer and validator tests
        run: python3 -m unittest discover apps/ios/Tools/Tests -p 'test_*.py'

      - name: Run release-audit harness
        run: bash apps/ios/Tools/Tests/audit-release-privacy.test.sh

      - name: Run source privacy and bundled-data audit
        run: bash apps/ios/Tools/audit_release_privacy.sh source

      - name: Prove required-check failure path
        if: ${{ inputs.prove_failure }}
        run: exit 1

  ios-unit:
    name: ios-fast / Unit
    needs: scope
    if: ${{ needs.scope.outputs.ios_changed == 'true' && !inputs.prove_failure }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out exact source and LFS data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: true

      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Run the complete unit target
        run: |
          apps/ios/Tools/run_ci_test_plan.sh \
            ZenbuPR \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max \
            "$RUNNER_TEMP/ZenbuFast-Unit.xcresult" \
            -only-testing:ZenbuJapaneseTests

      - name: Package test evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/ZenbuFast-Unit.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/ZenbuFast-Unit.xcresult" "$RUNNER_TEMP/ZenbuFast-Unit.xcresult.zip"
          fi

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ZenbuFast-Unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZenbuFast-Unit.xcresult.zip
          if-no-files-found: warn
          retention-days: 30

  ios-ui:
    name: ios-fast / Critical UI
    needs: scope
    if: ${{ needs.scope.outputs.ios_changed == 'true' && !inputs.prove_failure }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out exact source and LFS data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: true

      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Run the bounded critical-journey set
        run: |
          apps/ios/Tools/run_ci_test_plan.sh \
            ZenbuPR \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max \
            "$RUNNER_TEMP/ZenbuFast-UI.xcresult" \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testSearchChromeKeepsImageSearchOutsideTheFieldAndMovesSourcesToMore \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testBottomNavigationContainsOnlyReleaseDestinationsAndRestoresSearch \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testCameraUnavailableOnSimulatorReportsHardwareBoundary \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testImageTextClearFileSupportsHighlightsGlossNestedWordSharingAndClose \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testKanjiDetailShowsSourceBackedClassificationAndReadings \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testNewestRecentSearchRerunsItsResultSet \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testEnglishQueryReturnsRankedDictionaryResults \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testWordNoteCanBeAddedPersistedAcrossColdRelaunchAndDeleted \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testExampleSentencesCanBeOpenedScrolledSpokenAndTraversed \
            -only-testing:ZenbuJapaneseUITests/SearchExperienceJourneyUITests/testIchidanConjugationsSwitchBetweenPlainAndPoliteAndReturnToWordDetail

      - name: Package test evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/ZenbuFast-UI.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/ZenbuFast-UI.xcresult" "$RUNNER_TEMP/ZenbuFast-UI.xcresult.zip"
          fi

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ZenbuFast-UI-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZenbuFast-UI.xcresult.zip
          if-no-files-found: warn
          retention-days: 30

  ios-accessibility:
    name: ios-fast / Accessibility smoke
    needs: scope
    if: ${{ needs.scope.outputs.ios_changed == 'true' && !inputs.prove_failure }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out exact source and LFS data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: true

      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Run focused accessibility coverage
        run: |
          apps/ios/Tools/run_ci_test_plan.sh \
            ZenbuAccessibility \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max \
            "$RUNNER_TEMP/ZenbuFast-Accessibility.xcresult" \
            -only-testing:ZenbuJapaneseUITests/AccessibilityAuditUITests/testLightImageSourceActionsHaveReadableSystemContrast \
            -only-testing:ZenbuJapaneseUITests/AccessibilityAuditUITests/testLightRecentSearchDeleteActionHasReadableSystemContrast \
            -only-testing:ZenbuJapaneseUITests/AccessibilityAuditUITests/testDarkRecentSearchDeleteActionHasReadableSystemContrast \
            -only-testing:ZenbuJapaneseUITests/AccessibilityAuditUITests/testDarkRecentSearchAndNoResultsRemainUsableAtLargestAccessibilityTextSize \
            -only-testing:ZenbuJapaneseUITests/AccessibilityAuditUITests/testLightLoadingAndFailureRemainUsableAtLargestAccessibilityTextSize \
            -only-testing:ZenbuJapaneseUITests/AccessibilityAuditUITests/testDarkLoadingAndFailureRemainUsableAtLargestAccessibilityTextSize

      - name: Package test evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/ZenbuFast-Accessibility.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/ZenbuFast-Accessibility.xcresult" "$RUNNER_TEMP/ZenbuFast-Accessibility.xcresult.zip"
          fi

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ZenbuFast-Accessibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZenbuFast-Accessibility.xcresult.zip
          if-no-files-found: warn
          retention-days: 30

  required:
    name: ios-fast / Required
    if: always()
    needs: [scope, repo-contracts, ios-unit, ios-ui, ios-accessibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every relevant fast partition
        env:
          IOS_CHANGED: ${{ needs.scope.outputs.ios_changed }}
          CONTRACTS_RESULT: ${{ needs.repo-contracts.result }}
          UNIT_RESULT: ${{ needs.ios-unit.result }}
          UI_RESULT: ${{ needs.ios-ui.result }}
          ACCESSIBILITY_RESULT: ${{ needs.ios-accessibility.result }}
        run: |
          set -euo pipefail
          if [[ "$IOS_CHANGED" != true ]]; then
            echo 'No iOS consumer changed; the required fast gate passes without macOS work.'
            exit 0
          fi
          printf 'Contracts: %s\nUnit: %s\nCritical UI: %s\nAccessibility smoke: %s\n' \
            "$CONTRACTS_RESULT" "$UNIT_RESULT" "$UI_RESULT" "$ACCESSIBILITY_RESULT"
          [[ "$CONTRACTS_RESULT" == success ]]
          [[ "$UNIT_RESULT" == success ]]
          [[ "$UI_RESULT" == success ]]
          [[ "$ACCESSIBILITY_RESULT" == success ]]
