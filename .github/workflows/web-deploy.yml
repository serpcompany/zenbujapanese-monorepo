name: Web deploy

# Promotes merged website code through staging, then production, per the SERP Drizzle + D1
# standard. Production waits for approval on the `production` GitHub environment.
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web-deploy.yml
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.zenbujapanese.com
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:staging
      - name: Deploy
        run: pnpm deploy:staging 2>&1 | tee deploy.log
      - name: Smoke test
        # The workers.dev URL skips the zone's bot protection, which blocks CI runners.
        run: ./scripts/smoke.sh "$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" staging

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_PRODUCTION_URL }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:production
      - name: Deploy
        run: pnpm deploy:production 2>&1 | tee deploy.log
      - name: Smoke test
        # The workers.dev URL skips the zone's bot protection, which blocks CI runners.
        run: ./scripts/smoke.sh "$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" production
