name: Web deploy

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/dictionary-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-deploy.yml
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.zenbujapanese.com
    env:
      SITE: staging
      DICTIONARY_API_URL: ${{ vars.DICTIONARY_API_URL }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Wait for this commit's dictionary service deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-dictionary-service.sh "$SITE"
      - name: Point the site at the dictionary service
        run: ./scripts/use-dictionary-service.sh "$SITE" "$DICTIONARY_API_URL"
      - name: Deploy
        run: pnpm deploy:staging 2>&1 | tee deploy.log
      - name: Smoke test
        run: ./scripts/smoke.sh "$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" staging

  production:
    needs: staging
    if: vars.DEPLOY_PRODUCTION != 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_PRODUCTION_URL }}
    env:
      SITE: production
      DICTIONARY_API_URL: ${{ vars.DICTIONARY_API_URL }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Wait for this commit's dictionary service deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-dictionary-service.sh "$SITE"
      - name: Point the site at the dictionary service
        run: ./scripts/use-dictionary-service.sh "$SITE" "$DICTIONARY_API_URL"
      - name: Deploy
        run: pnpm deploy:production 2>&1 | tee deploy.log
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" production
