name: Web deploy

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/dictionary-core/**
      - apps/dictionary-api/**
      - packages/node-service/**
      - apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3
      - apps/ios/Modules/Sources/SearchExperience/Resources/Kanji*ReferenceData.json
      - apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json
      - apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/**
      - language-data/release.json
      - language-data/releases/*/manifest.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/web-deploy.yml
      - '!apps/dictionary-api/**/*.test.ts'
      - '!apps/dictionary-api/src/conformance/**'
      - '!packages/node-service/**/*.test.ts'
      - '!packages/node-service/src/test/**'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.zenbujapanese.com
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      SITE: staging
      DICTIONARY_API_URL: ${{ vars.DICTIONARY_API_URL }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Refuse to deploy from an old run started again
        uses: ./.github/actions/latest-run
        with:
          workflow: web-deploy.yml
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Wait for this commit's dictionary service deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-dictionary-service.sh "$SITE"
      - name: Point the site at the dictionary service
        run: ./scripts/use-dictionary-service.sh "$SITE" "$DICTIONARY_API_URL"
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the dictionary's sitemaps from the environment's service image
        run: ./scripts/write-dictionary-sitemaps.sh "$SITE"
      - name: Deploy
        run: pnpm deploy:staging 2>&1 | tee deploy.log
      - name: Smoke test
        run: ./scripts/smoke.sh "$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" staging

  production:
    needs: staging
    if: vars.DEPLOY_PRODUCTION != 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.WEB_PRODUCTION_URL }}
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      SITE: production
      DICTIONARY_API_URL: ${{ vars.DICTIONARY_API_URL }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Refuse to deploy from an old run started again
        uses: ./.github/actions/latest-run
        with:
          workflow: web-deploy.yml
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Wait for this commit's dictionary service deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-dictionary-service.sh "$SITE"
      - name: Point the site at the dictionary service
        run: ./scripts/use-dictionary-service.sh "$SITE" "$DICTIONARY_API_URL"
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the dictionary's sitemaps from the environment's service image
        run: ./scripts/write-dictionary-sitemaps.sh "$SITE"
      - name: Deploy
        run: pnpm deploy:production 2>&1 | tee deploy.log
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" production
