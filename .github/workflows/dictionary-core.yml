name: Dictionary core

on:
  pull_request:
  merge_group:

concurrency:
  group: dictionary-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: paths
        uses: ./.github/actions/changed-paths
        with:
          paths: >-
            packages/dictionary-core package.json pnpm-lock.yaml pnpm-workspace.yaml
            .github/workflows/dictionary-core.yml .github/actions/changed-paths

  check:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/dictionary-core
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  dictionary-core:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
