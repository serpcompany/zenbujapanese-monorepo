name: Language data release

# Publishes the language-data release named in language-data/release.json to the
# zenbujapanese-language-data R2 bucket (issue 463, step 3), then reads it back:
#   files/<sha256>/<name>, then releases/<release>/manifest.json, then releases.json.
# Nothing published is ever overwritten. When the release is already published with the same
# content this is a no-op; when its content changed, it fails: bump language-data/release.json.
# It rebuilds from this commit rather than trusting the build workflow's output, and it is the
# only holder of the bucket's token. See language-data/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'language-data/**'
      - '.github/workflows/language-data-release.yml'
      - '.github/actions/package-language-data/**'
  workflow_dispatch:

# One publish at a time, and never cancelled halfway.
concurrency:
  group: language-data-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deploys only from protected branches (main). It has no required reviewer, by the owner's
    # decision; add one in Settings → Environments to review each release by hand.
    environment: language-data-release
    defaults:
      run:
        shell: bash
    env:
      R2_BUCKET: zenbujapanese-language-data
      R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      # Send only the checksum publish.py gives (SHA-256), not the CLI's default CRC trailers.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      # Before the 516 MiB build, so a missing token fails in seconds, by name.
      - name: Check the R2 token
        env:
          HAS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=()
          [ "$HAS_ACCESS_KEY_ID" = true ] || missing+=("secret R2_ACCESS_KEY_ID")
          [ "$HAS_SECRET_ACCESS_KEY" = true ] || missing+=("secret R2_SECRET_ACCESS_KEY")
          [ "$HAS_ACCOUNT_ID" = true ] || missing+=("variable CLOUDFLARE_ACCOUNT_ID")
          if ((${#missing[@]})); then
            for item in "${missing[@]}"; do
              echo "::error title=Missing R2 credentials::The language-data-release environment has no ${item}. Add the bucket-scoped R2 token (Settings → Environments → language-data-release) and run this workflow again. Nothing was published."
            done
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-language-data
        with:
          out: ${{ runner.temp }}/language-data
      - run: aws --version
      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python language-data/pipeline/publish.py publish "$RUNNER_TEMP/language-data" | tee -a "$GITHUB_STEP_SUMMARY"
      # Reads releases.json and the manifest back, and downloads and hashes every file.
      - name: Verify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python language-data/pipeline/publish.py verify --hash all | tee -a "$GITHUB_STEP_SUMMARY"
