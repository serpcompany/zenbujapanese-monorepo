name: Dictionary API

# The dictionary service (apps/dictionary-api, ADR 0009) on pull requests: Biome, typecheck, and
# its tests, which replay the app-recorded suites on the app's real files; then the website's
# rendered-page gate, rendering what the built service answers. The `Dictionary API deploy`
# workflow builds and checks its Docker image. See docs/agents/dictionary-api.md.
#
# The Git LFS files (about 520 MB) are cached under a hash of their pointers, so a run downloads
# them only when they change. A pull request's cache is visible only to that pull request, so a
# push to main that changes them builds the cache every later pull request restores. Sudachi's
# dictionary is cached under the app's pin the same way.
on:
  pull_request:
    paths:
      - apps/dictionary-api/**
      - packages/dictionary-core/**
      - apps/web/src/lib/dictionary/**
      - apps/web/src/components/dictionary/**
      - apps/web/vitest.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/ios/LanguageData/Conformance/**
      - apps/ios/Modules/Sources/SearchExperience/Resources/**
      - .github/workflows/dictionary-api.yml
  push:
    branches: [main]
    # The Git LFS files and Sudachi's pin, so main holds the caches for their current versions.
    paths:
      - apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3
      - apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/**
      - apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json
      - .github/workflows/dictionary-api.yml
  workflow_dispatch:

concurrency:
  group: dictionary-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RESOURCES: apps/ios/Modules/Sources/SearchExperience/Resources

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the deploy scripts
        # ShellCheck 0.11, pinned: the runner's own is older.
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          apps/dictionary-api/deploy/deployer.sh

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The suites fail, rather than skip, without the app's files or Sudachi's dictionary.
      ZENBU_REQUIRE_ARTIFACT: '1'
      # Only this job's service and the gate use it.
      DICTIONARY_API_TOKEN: ci-only-dictionary-api-token
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Git LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-resources-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/**') }}
      - name: Fetch the Git LFS files
        # The app's bundled data the service reads; downloads only what the cache didn't restore.
        run: git lfs pull --include="$RESOURCES/*.sqlite3,$RESOURCES/Kuromoji/*"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore Sudachi's dictionary
        uses: actions/cache@v4
        with:
          path: apps/dictionary-api/.sudachi
          key: sudachi-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json') }}
      - name: Fetch Sudachi's dictionary
        # Keeps a cached copy that matches the app's pin, or downloads and checks it.
        working-directory: apps/dictionary-api
        run: pnpm sudachi
      - name: Check the service
        # Lint, typecheck, the conformance suites, and the bundle.
        working-directory: apps/dictionary-api
        run: pnpm check
      - name: Start the service
        working-directory: apps/dictionary-api
        run: |
          node --disable-warning=ExperimentalWarning dist/server.mjs > service.log 2>&1 &
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8788/healthz
      - name: Check the website's pages against the app, rendered from the service
        working-directory: apps/web
        env:
          ZENBU_DICTIONARY_API: '1'
          ZENBU_DICTIONARY_API_TOKEN: ${{ env.DICTIONARY_API_TOKEN }}
        run: pnpm exec vitest run src/components/dictionary
      - name: Show the service's log
        if: failure()
        run: cat apps/dictionary-api/service.log || true
