name: Dictionary API

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3
      - apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/**
      - apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json
      - .github/workflows/dictionary-api.yml
  workflow_dispatch:

concurrency:
  group: dictionary-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  RESOURCES: apps/ios/Modules/Sources/SearchExperience/Resources

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: paths
        uses: ./.github/actions/changed-paths
        with:
          paths: >-
            apps/dictionary-api packages/dictionary-core packages/node-service
            docs/api/dictionary-api.md apps/web/src/lib/dictionary
            apps/web/src/components/dictionary apps/web/src/test apps/web/vitest.config.ts
            apps/web/e2e/server.ts tools/checks/ports.mjs .node-version
            package.json pnpm-lock.yaml pnpm-workspace.yaml apps/ios/LanguageData/Conformance
            apps/ios/Modules/Sources/SearchExperience/Resources language-data/release.json
            deploy/deployer.sh .github/workflows/dictionary-api.yml
            .github/actions/changed-paths

  scripts:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck the deployer
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          deploy/deployer.sh

  check:
    needs: [changes, scripts]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZENBU_REQUIRE_ARTIFACT: '1'
      DICTIONARY_API_TOKEN: ci-only-dictionary-api-token
    steps:
      - uses: actions/checkout@v5
      - name: Restore the Git LFS files
        uses: actions/cache@v5
        with:
          path: .git/lfs/objects
          key: lfs-resources-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/**') }}
      - name: Fetch the Git LFS files
        run: git lfs pull --include="$RESOURCES/*.sqlite3,$RESOURCES/Kuromoji/*"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore Sudachi's dictionary
        uses: actions/cache@v5
        with:
          path: apps/dictionary-api/.sudachi
          key: sudachi-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/LanguageTechnologyPackCatalog.json') }}
      - name: Fetch Sudachi's dictionary
        working-directory: apps/dictionary-api
        run: pnpm sudachi
      - name: Check the service
        working-directory: apps/dictionary-api
        run: pnpm check
      - name: The core's fixtures match the language data
        run: |
          pnpm --filter zenbujapanese-dictionary-api fixtures
          changed=$(git status --porcelain --untracked-files=all -- packages/dictionary-core/src/fixtures)
          if [ -n "$changed" ]; then
            git diff -- packages/dictionary-core/src/fixtures
            echo "::error::The fixtures export changed or added: ${changed//$'\n'/, }. Run pnpm --filter zenbujapanese-dictionary-api fixtures and commit the result."
            exit 1
          fi
      - name: Start the service
        working-directory: apps/dictionary-api
        run: |
          node --disable-warning=ExperimentalWarning dist/server.mjs > service.log 2>&1 &
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8788/healthz
      - name: Check the website's pages against the app, rendered from the service
        working-directory: apps/web
        env:
          ZENBU_DICTIONARY_API: '1'
          ZENBU_DICTIONARY_API_TOKEN: ${{ env.DICTIONARY_API_TOKEN }}
        run: pnpm exec vitest run src/components/dictionary
      - name: Show the service's log
        if: failure()
        run: cat apps/dictionary-api/service.log || true

  dictionary-api:
    if: always()
    needs: [changes, scripts, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
