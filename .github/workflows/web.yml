name: Web

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/dictionary-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ShellCheck the scripts
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=warning
          scripts/smoke.sh scripts/use-dictionary-service.sh scripts/wait-for-dictionary-service.sh
      - run: pnpm check
      - name: Build for staging
        run: SITE_ENV=staging pnpm build
      - name: Build for production
        run: SITE_ENV=production pnpm build
