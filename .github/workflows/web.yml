name: Web

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/dictionary-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # pnpm check builds without SITE_ENV. Build as each deployed environment does too, since
      # static pages and prerendering differ by environment: a route that reads a binding at
      # build time fails only there. Neither build reaches the dictionary service, as in a deploy,
      # where pages read it only at request time.
      - name: Build for staging
        run: SITE_ENV=staging pnpm build
      - name: Build for production
        run: SITE_ENV=production pnpm build
