name: Web

on:
  pull_request:
  merge_group:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: paths
        uses: ./.github/actions/changed-paths
        with:
          paths: >-
            apps/web packages/dictionary-core packages/account-rules package.json pnpm-lock.yaml
            pnpm-workspace.yaml
            .node-version tools/checks/ports.mjs .github/workflows/web.yml
            .github/actions/changed-paths

  check:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: ShellCheck the scripts
        working-directory: apps/web
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=warning
          scripts/smoke.sh scripts/smoke-indexing.sh scripts/use-dictionary-service.sh
          scripts/wait-for-dictionary-service.sh
      - name: cloudflare-env.d.ts matches wrangler.jsonc
        working-directory: apps/web
        run: |
          pnpm cf-typegen
          changed=$(git status --porcelain --untracked-files=all -- .)
          if [ -n "$changed" ]; then
            git diff -- cloudflare-env.d.ts
            echo "::error::pnpm cf-typegen changed or added: ${changed//$'\n'/, }. Run it in apps/web and commit cloudflare-env.d.ts, the only file it should write."
            exit 1
          fi
      - working-directory: apps/web
        run: pnpm check
      - name: No page's JavaScript holds the dictionaries
        working-directory: apps/web
        run: >-
          node -e '
          const { readdirSync, readFileSync } = require("node:fs");
          const chunks = readdirSync(".next/static", { recursive: true }).filter(file => file.endsWith(".js"));
          const escaped = text => text.replace(/[^\x00-\x7f]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
          for (const language of ["en", "ja"]) {
          const dictionary = require("./src/lib/i18n/dictionaries/" + language + ".json");
          const values = [];
          const collect = node => Object.values(node).forEach(value => typeof value === "string" ? values.push(value) : collect(value));
          collect(dictionary);
          const phrases = values.filter(value => !/[\\"\x27`$]/.test(value)).sort((a, b) => b.length - a.length).slice(0, 5);
          const markers = [JSON.stringify(dictionary).slice(0, 60), ...phrases].flatMap(marker => [marker, escaped(marker)]);
          for (const chunk of chunks) {
          const text = readFileSync(".next/static/" + chunk, "utf8");
          if (markers.some(marker => text.includes(marker))) {
          console.log("::error::.next/static/" + chunk + " holds " + language + ".json. A client component gets its strings from its server parent, never the dictionary (docs/agents/web-languages.md, Strings).");
          process.exitCode = 1;
          }
          }
          }'
      - name: Build for staging
        working-directory: apps/web
        run: SITE_ENV=staging pnpm build
      - name: Staging's footer links signing in
        working-directory: apps/web
        run: |
          grep -q 'href="/login/">Sign in<' .next/server/app/en/about.html
          grep -q 'href="/ja/login/">ログイン<' .next/server/app/ja/about.html
      - name: Build for production
        working-directory: apps/web
        run: SITE_ENV=production pnpm build
      - name: Production's footer links signing in
        working-directory: apps/web
        run: |
          grep -q 'href="/login/">Sign in<' .next/server/app/en/about.html
          grep -q 'href="/ja/login/">ログイン<' .next/server/app/ja/about.html

  e2e:
    needs: [changes, check]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the site as it deploys, on the fixtures
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
      - name: Run the browser tests on the build, in workerd
        working-directory: apps/web
        env:
          E2E_SERVER: preview
          E2E_SERVER_LOG: e2e/server.log
        run: pnpm test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/e2e/report
            apps/web/e2e/results
            apps/web/e2e/server.log
          retention-days: 7

  web:
    if: always()
    needs: [changes, check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
