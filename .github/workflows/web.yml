name: Web

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/dictionary-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ShellCheck the scripts
        working-directory: apps/web
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=warning
          scripts/smoke.sh scripts/use-dictionary-service.sh scripts/wait-for-dictionary-service.sh
      - name: cloudflare-env.d.ts matches wrangler.jsonc
        working-directory: apps/web
        run: |
          pnpm cf-typegen
          changed=$(git status --porcelain --untracked-files=all -- .)
          if [ -n "$changed" ]; then
            git diff -- cloudflare-env.d.ts
            echo "::error::pnpm cf-typegen changed or added: ${changed//$'\n'/, }. Run it in apps/web and commit cloudflare-env.d.ts, the only file it should write."
            exit 1
          fi
      - working-directory: apps/web
        run: pnpm check
      - name: Build for staging
        working-directory: apps/web
        run: SITE_ENV=staging pnpm build
      - name: Staging's footer links signing in
        working-directory: apps/web
        run: grep -q 'href="/login/"' .next/server/app/about.html
      - name: Build for production
        working-directory: apps/web
        run: SITE_ENV=production pnpm build
      - name: Production's footer doesn't, while its account pages are closed
        working-directory: apps/web
        run: |
          if grep -q 'href="/login/"' .next/server/app/about.html; then
            echo "::error::The production build links /login/, but production's ACCOUNT_API_URL in wrangler.jsonc is empty, so its account pages are closed (docs/agents/web.md, Account pages)."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the site as it deploys, on the fixtures
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
      - name: Run the browser tests on the build, in workerd
        working-directory: apps/web
        env:
          E2E_SERVER: preview
        run: pnpm test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/e2e/report
            apps/web/e2e/results
          retention-days: 7
