name: Web

on:
  pull_request:
    paths:
      - apps/web/**
      - packages/dictionary-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ShellCheck the scripts
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=warning
          scripts/smoke.sh scripts/use-dictionary-service.sh scripts/wait-for-dictionary-service.sh
      - run: pnpm check
      - name: Build for staging
        run: SITE_ENV=staging pnpm build
      - name: Build for production
        run: SITE_ENV=production pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the site as it deploys, on the fixtures
        run: pnpm exec opennextjs-cloudflare build
      - name: Run the browser tests on the build, in workerd
        env:
          E2E_SERVER: preview
        run: pnpm test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/e2e/report
            apps/web/e2e/results
          retention-days: 7
