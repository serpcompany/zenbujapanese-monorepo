name: Search parity

# Search retrieval exists twice until issue 481 makes TypeScript the single core (ADR 0008):
# Swift for the iOS app and a TypeScript port for the website. A PR that changes one must change
# the other, or carry the search-parity-reviewed label to say the change only applies to one side.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - apps/ios/Modules/Sources/SearchExperience/LookupClient.swift
      - apps/ios/Modules/Sources/SearchExperience/SearchQuery.swift
      - apps/ios/Modules/Sources/SearchExperience/DictionaryRanking.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseDeinflection.swift
      - apps/ios/Modules/Sources/SearchExperience/DictionaryEntry.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseTextAnalysisClient.swift
      - apps/web/src/lib/dictionary/search/**

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'search-parity-reviewed') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require both search implementations to change together
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          swift=$(echo "$changed" | grep -E '^apps/ios/Modules/Sources/SearchExperience/(LookupClient|SearchQuery|DictionaryRanking|JapaneseDeinflection|DictionaryEntry|JapaneseTextAnalysisClient)\.swift$' || true)
          typescript=$(echo "$changed" | grep -E '^apps/web/src/lib/dictionary/search/' || true)
          if [ -n "$swift" ] && [ -z "$typescript" ]; then
            echo "::error::Swift search changed without the TypeScript port (apps/web/src/lib/dictionary/search/). Change both and re-record the conformance suite, or add the search-parity-reviewed label if the change only applies to iOS."
            echo "$swift"
            exit 1
          fi
          if [ -n "$typescript" ] && [ -z "$swift" ]; then
            echo "::error::The TypeScript search port changed without the Swift search (apps/ios/Modules/Sources/SearchExperience/). Change both and re-record the conformance suite, or add the search-parity-reviewed label if the change only applies to the website."
            echo "$typescript"
            exit 1
          fi
          echo "Search parity OK."
