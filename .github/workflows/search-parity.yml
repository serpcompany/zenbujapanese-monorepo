name: Search parity

# Search retrieval, word pages' examples, and parts of the word page's detail (the furigana kanji
# highlight, the pitch graph, Frequency Details, and the conjugation table) and of the kanji element
# page exist twice until issue 481 makes TypeScript the single core (ADR 0008): Swift for the iOS
# app and a TypeScript port for the website. Each pair below is a Swift source and its port; a PR that changes one side of a
# pair must change the other, or carry the search-parity-reviewed label to say the change only
# applies to one side.
#
#   search:   LookupClient, SearchQuery, DictionaryRanking, JapaneseDeinflection, DictionaryEntry,
#             JapaneseTextAnalysisClient <-> apps/web/src/lib/dictionary/search/
#   examples: ExampleSentenceClient, JapaneseTextAnalysisClient, JapaneseInflectionGrouping,
#             KuromojiMorphologyClient, LinkedJapaneseText (the conjugated form's highlight)
#             <-> apps/web/src/lib/dictionary/examples/*.ts
#   detail:   KanjiReadingSplitter, JapaneseRubyText (the per-kanji furigana highlight),
#             WordDetailView (PitchContourLayout, FrequencyDisclosurePresentation), FrequencyPack,
#             JapaneseConjugationClient, ConjugationsView, KanjiElementLookupClient,
#             KanjiElementDetailView
#             <-> apps/web/src/lib/dictionary/detail/{kanji-split,pitch,frequency,conjugation,element}.ts

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - apps/ios/Modules/Sources/SearchExperience/LookupClient.swift
      - apps/ios/Modules/Sources/SearchExperience/SearchQuery.swift
      - apps/ios/Modules/Sources/SearchExperience/DictionaryRanking.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseDeinflection.swift
      - apps/ios/Modules/Sources/SearchExperience/DictionaryEntry.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseTextAnalysisClient.swift
      - apps/ios/Modules/Sources/SearchExperience/ExampleSentenceClient.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseInflectionGrouping.swift
      - apps/ios/Modules/Sources/SearchExperience/KuromojiMorphologyClient.swift
      - apps/ios/Modules/Sources/SearchExperience/LinkedJapaneseText.swift
      - apps/ios/Modules/Sources/SearchExperience/KanjiReadingSplitter.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseRubyText.swift
      - apps/ios/Modules/Sources/SearchExperience/WordDetailView.swift
      - apps/ios/Modules/Sources/SearchExperience/FrequencyPack.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseConjugationClient.swift
      - apps/ios/Modules/Sources/SearchExperience/ConjugationsView.swift
      - apps/ios/Modules/Sources/SearchExperience/KanjiElementLookupClient.swift
      - apps/ios/Modules/Sources/SearchExperience/KanjiElementDetailView.swift
      - apps/web/src/lib/dictionary/search/**
      - apps/web/src/lib/dictionary/examples/*.ts
      - apps/web/src/lib/dictionary/detail/kanji-split.ts
      - apps/web/src/lib/dictionary/detail/pitch.ts
      - apps/web/src/lib/dictionary/detail/frequency.ts
      - apps/web/src/lib/dictionary/detail/conjugation.ts
      - apps/web/src/lib/dictionary/detail/element.ts

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'search-parity-reviewed') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require both implementations of each pair to change together
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          swift_dir='^apps/ios/Modules/Sources/SearchExperience/'
          status=0
          # check <pair> <Swift pattern> <TypeScript pattern> <TypeScript location>
          check() {
            local swift typescript
            swift=$(echo "$changed" | grep -E "$2" || true)
            typescript=$(echo "$changed" | grep -E "$3" || true)
            if [ -n "$swift" ] && [ -z "$typescript" ]; then
              echo "::error::The Swift $1 changed without its TypeScript port ($4). Change both and re-record the conformance suite, or add the search-parity-reviewed label if the change only applies to iOS."
              echo "$swift"
              status=1
            fi
            if [ -n "$typescript" ] && [ -z "$swift" ]; then
              echo "::error::The TypeScript $1 port ($4) changed without the Swift. Change both and re-record the conformance suite, or add the search-parity-reviewed label if the change only applies to the website."
              echo "$typescript"
              status=1
            fi
          }
          check search \
            "${swift_dir}(LookupClient|SearchQuery|DictionaryRanking|JapaneseDeinflection|DictionaryEntry|JapaneseTextAnalysisClient)\.swift$" \
            '^apps/web/src/lib/dictionary/search/' 'apps/web/src/lib/dictionary/search/'
          check examples \
            "${swift_dir}(ExampleSentenceClient|JapaneseTextAnalysisClient|JapaneseInflectionGrouping|KuromojiMorphologyClient|LinkedJapaneseText)\.swift$" \
            '^apps/web/src/lib/dictionary/examples/[^/]+\.ts$' 'apps/web/src/lib/dictionary/examples/'
          check detail \
            "${swift_dir}(KanjiReadingSplitter|JapaneseRubyText|WordDetailView|FrequencyPack|JapaneseConjugationClient|ConjugationsView|KanjiElementLookupClient|KanjiElementDetailView)\.swift$" \
            '^apps/web/src/lib/dictionary/detail/(kanji-split|pitch|frequency|conjugation|element)\.ts$' \
            'apps/web/src/lib/dictionary/detail/{kanji-split,pitch,frequency,conjugation,element}.ts'
          [ "$status" -eq 0 ] && echo "Search parity OK."
          exit "$status"
