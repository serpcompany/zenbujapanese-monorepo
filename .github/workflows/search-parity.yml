name: Search parity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - apps/ios/Modules/Sources/SearchExperience/LookupClient.swift
      - apps/ios/Modules/Sources/SearchExperience/LookupDatabase.swift
      - apps/ios/Modules/Sources/SearchExperience/LookupEnglishRanking.swift
      - apps/ios/Modules/Sources/SearchExperience/LookupJapaneseRanking.swift
      - apps/ios/Modules/Sources/SearchExperience/LookupRankedEntries.swift
      - apps/ios/Modules/Sources/SearchExperience/SearchQuery.swift
      - apps/ios/Modules/Sources/SearchExperience/DictionaryRanking.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseDeinflection.swift
      - apps/ios/Modules/Sources/SearchExperience/DictionaryEntry.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseTextAnalysisClient.swift
      - apps/ios/Modules/Sources/SearchExperience/ExampleSentenceClient.swift
      - apps/ios/Modules/Sources/SearchExperience/ExampleSentenceDatabase.swift
      - apps/ios/Modules/Sources/SearchExperience/ExampleSentenceEntryRetrieval.swift
      - apps/ios/Modules/Sources/SearchExperience/ExampleSentenceModels.swift
      - apps/ios/Modules/Sources/SearchExperience/ExampleSentenceSearchRetrieval.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseInflectionGrouping.swift
      - apps/ios/Modules/Sources/SearchExperience/KuromojiMorphologyClient.swift
      - apps/ios/Modules/Sources/SearchExperience/LinkedJapaneseText.swift
      - apps/ios/Modules/Sources/SearchExperience/KanjiReadingSplitter.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseRubyText.swift
      - apps/ios/Modules/Sources/SearchExperience/WordDetailView.swift
      - apps/ios/Modules/Sources/SearchExperience/FrequencyPack.swift
      - apps/ios/Modules/Sources/SearchExperience/JapaneseConjugationClient.swift
      - apps/ios/Modules/Sources/SearchExperience/ConjugationsView.swift
      - packages/dictionary-core/src/search/**
      - packages/dictionary-core/src/examples/*.ts
      - packages/dictionary-core/src/artifact/example-retrieval.ts
      - packages/dictionary-core/src/artifact/example-search.ts
      - packages/dictionary-core/src/artifact/word-examples.ts
      - packages/dictionary-core/src/artifact/search-examples.ts
      - packages/dictionary-core/src/artifact/lookup.ts
      - apps/dictionary-api/src/kuromoji.ts
      - packages/dictionary-core/src/detail/kanji-split.ts
      - packages/dictionary-core/src/detail/pitch.ts
      - packages/dictionary-core/src/detail/frequency.ts
      - packages/dictionary-core/src/detail/conjugation.ts
      - packages/dictionary-core/src/detail/conjugation-table.ts

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'search-parity-reviewed') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require both implementations of each pair to change together
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          swift_dir='^apps/ios/Modules/Sources/SearchExperience/'
          status=0
          check() {
            local pair="$1" swift_pattern="$2" typescript_pattern="$3" typescript_location="$4"
            local swift typescript
            swift=$(echo "$changed" | grep -E "$swift_pattern" || true)
            typescript=$(echo "$changed" | grep -E "$typescript_pattern" || true)
            if [ -n "$swift" ] && [ -z "$typescript" ]; then
              echo "::error::The Swift $pair changed without its TypeScript port ($typescript_location). Change both and re-record the conformance suite, or add the search-parity-reviewed label if the change only applies to iOS."
              echo "$swift"
              status=1
            fi
            if [ -n "$typescript" ] && [ -z "$swift" ]; then
              echo "::error::The TypeScript $pair port ($typescript_location) changed without the Swift. Change both and re-record the conformance suite, or add the search-parity-reviewed label if the change only applies to the website."
              echo "$typescript"
              status=1
            fi
          }
          check search \
            "${swift_dir}(LookupClient|LookupDatabase|LookupEnglishRanking|LookupJapaneseRanking|LookupRankedEntries|SearchQuery|DictionaryRanking|JapaneseDeinflection|DictionaryEntry|JapaneseTextAnalysisClient)\.swift$" \
            '^packages/dictionary-core/src/search/' 'packages/dictionary-core/src/search/'
          check examples \
            "${swift_dir}(ExampleSentenceClient|ExampleSentenceDatabase|ExampleSentenceEntryRetrieval|ExampleSentenceModels|ExampleSentenceSearchRetrieval|JapaneseTextAnalysisClient|JapaneseInflectionGrouping|KuromojiMorphologyClient|LinkedJapaneseText)\.swift$" \
            '^(packages/dictionary-core/src/examples/[^/]+|packages/dictionary-core/src/artifact/(example-retrieval|example-search|word-examples|search-examples|lookup)|apps/dictionary-api/src/kuromoji)\.ts$' \
            'packages/dictionary-core/src/examples/ and its artifact/ example files'
          check detail \
            "${swift_dir}(KanjiReadingSplitter|JapaneseRubyText|WordDetailView|FrequencyPack|JapaneseConjugationClient|ConjugationsView)\.swift$" \
            '^packages/dictionary-core/src/detail/(kanji-split|pitch|frequency|conjugation|conjugation-table)\.ts$' \
            'packages/dictionary-core/src/detail/{kanji-split,pitch,frequency,conjugation,conjugation-table}.ts'
          [ "$status" -eq 0 ] && echo "Search parity OK."
          exit "$status"
