name: Language data build

# Packages the next language-data release from the committed files (issue 463, step 2):
# language-data/pipeline/package.py writes manifest.json and files/<sha256>/<name>, refusing any
# file that differs from its Git LFS pointer, a conformance suite's pin, or another file's pin.
# It has no credentials and publishes nothing: the staging directory is only kept as an Actions
# artifact. The publish workflow (step 3) rebuilds rather than trusting this one's output.
on:
  pull_request:
    paths:
      - 'language-data/**'
      - '.github/workflows/language-data-build.yml'
      - 'apps/ios/Modules/Sources/SearchExperience/Resources/**'
      - 'apps/ios/LanguageData/**'
  push:
    branches: [main]
    paths:
      - 'language-data/**'
      - '.github/workflows/language-data-build.yml'
      - 'apps/ios/Modules/Sources/SearchExperience/Resources/**'
      - 'apps/ios/LanguageData/**'

concurrency:
  group: language-data-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Named explicitly so pipefail is on: `| tee` must not hide a refusal.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: language-data/pipeline/requirements.txt
      - run: pip install -r language-data/pipeline/requirements.txt
      - name: Test the packager and the manifest schema
        run: python -m unittest discover -s language-data/pipeline/tests -v
      - name: List the Git LFS files the release holds
        id: lfs
        run: echo "paths=$(python language-data/pipeline/package.py lfs-paths)" >> "$GITHUB_OUTPUT"
      # Their pointers are in the checkout until the pull, so this key is their oids.
      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: language-data-lfs-${{ hashFiles('apps/ios/Modules/Sources/SearchExperience/Resources/*.sqlite3', 'apps/ios/Modules/Sources/SearchExperience/Resources/Kuromoji/*.dat.gz') }}
      - name: Fetch only those files
        env:
          LFS_PATHS: ${{ steps.lfs.outputs.paths }}
        run: git lfs pull --include="$LFS_PATHS"
      - name: Package
        run: python language-data/pipeline/package.py build --out "$RUNNER_TEMP/language-data" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate the manifest and the staged files
        run: python language-data/pipeline/package.py validate "$RUNNER_TEMP/language-data"
      - uses: actions/upload-artifact@v4
        with:
          name: language-data-${{ github.sha }}
          path: ${{ runner.temp }}/language-data
          if-no-files-found: error
          retention-days: 7
