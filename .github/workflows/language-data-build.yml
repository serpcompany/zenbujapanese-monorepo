name: Language data build

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'language-data/**'
      - '.github/workflows/language-data-build.yml'
      - '.github/actions/package-language-data/**'
      - 'apps/ios/Modules/Sources/SearchExperience/Resources/**'
      - 'apps/ios/LanguageData/**'

concurrency:
  group: language-data-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - id: paths
        uses: ./.github/actions/changed-paths
        with:
          paths: >-
            language-data .github/workflows/language-data-release.yml
            .github/actions/package-language-data
            apps/ios/Modules/Sources/SearchExperience/Resources apps/ios/LanguageData
            .github/workflows/language-data-build.yml .github/actions/changed-paths

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/package-language-data
        with:
          out: ${{ runner.temp }}/language-data
      - name: List the staged files
        working-directory: ${{ runner.temp }}/language-data
        run: |
          mkdir -p "$RUNNER_TEMP/language-data-summary"
          cp manifest.json "$RUNNER_TEMP/language-data-summary/"
          find files -type f -printf '%s\t%p\n' | LC_ALL=C sort -k2 > "$RUNNER_TEMP/language-data-summary/files.tsv"
      - uses: actions/upload-artifact@v7
        with:
          name: language-data-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/language-data-summary
          if-no-files-found: error
          retention-days: 7

  language-data-build:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
