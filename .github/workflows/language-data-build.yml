name: Language data build

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'language-data/**'
      - '.python-version'
      - '.github/workflows/language-data-build.yml'
      - '.github/actions/package-language-data/**'
      - 'apps/ios/Modules/Sources/SearchExperience/Resources/**'
      - 'apps/dictionary-api/Dockerfile'

concurrency:
  group: language-data-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: paths
        uses: ./.github/actions/changed-paths
        with:
          paths: >-
            language-data .python-version .github/workflows/language-data-release.yml
            .github/actions/package-language-data
            apps/ios/Modules/Sources/SearchExperience/Resources
            apps/dictionary-api/Dockerfile
            .github/workflows/language-data-build.yml .github/actions/changed-paths

  pins:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - name: Check the committed files against the pinned manifest
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            python language-data/pipeline/package.py check-pin
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          python language-data/pipeline/package.py check-pin --base "$BASE"

  build:
    needs: [changes, pins]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/package-language-data
        with:
          out: ${{ runner.temp }}/language-data
      - name: List the staged files
        working-directory: ${{ runner.temp }}/language-data
        run: |
          mkdir -p "$RUNNER_TEMP/language-data-summary"
          cp manifest.json "$RUNNER_TEMP/language-data-summary/"
          find files -type f -printf '%s\t%p\n' | LC_ALL=C sort -k2 > "$RUNNER_TEMP/language-data-summary/files.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: language-data-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/language-data-summary
          if-no-files-found: error
          retention-days: 7

  language-data-build:
    if: always()
    needs: [changes, pins, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
