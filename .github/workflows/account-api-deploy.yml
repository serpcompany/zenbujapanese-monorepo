name: Account API deploy

on:
  push:
    branches: [main]
    paths:
      - apps/account-api/**
      - packages/node-service/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/account-api-deploy.yml
      - '!**/*.test.ts'
      - '!packages/node-service/src/test/**'
      - '!apps/account-api/deploy/**'
  pull_request:
    paths:
      - apps/account-api/**
      - packages/node-service/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/account-api-deploy.yml
      - '!**/*.test.ts'
      - '!packages/node-service/src/test/**'
      - '!apps/account-api/deploy/**'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Deploy an image already pushed instead of building this commit, by its tag, such as
          sha-0123456789ab (a rollback). Empty builds the commit.
        required: false
        default: ''

concurrency:
  group: account-api-deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/serpcompany/zenbujapanese-account-api

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      TAG: ${{ inputs.tag }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: account
          POSTGRES_DB: account
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username account" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: Name the release
        id: release
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Not an image tag: $TAG"
            exit 1
          fi
          echo "release=${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: env.TAG == ''
      - name: Build the image
        if: env.TAG == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/account-api/Dockerfile
          build-args: RELEASE=${{ steps.release.outputs.release }}
          load: true
          tags: zenbujapanese-account-api:candidate
          cache-from: type=gha,scope=account-api-image
          cache-to: type=gha,scope=account-api-image,mode=max
      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image to deploy again
        if: env.TAG != ''
        run: |
          docker pull "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" zenbujapanese-account-api:candidate
      - name: Check that the image migrates an empty database, starts, and answers
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          docker run --detach --name candidate --network host --read-only --tmpfs /tmp \
            --env DATABASE_URL=postgres://account@127.0.0.1:5432/account \
            --env ACCOUNT_API_URL=http://localhost:8789 \
            --env ACCOUNT_API_SECRET=ci-only-secret-for-the-image-check-0123 \
            zenbujapanese-account-api:candidate
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8789/healthz >health.json
          release="$(jq -r .release health.json)"
          echo "The image answers as release $release: $(cat health.json)"
          if [ -z "$TAG" ] && [ "$release" != "$RELEASE" ]; then
            echo "::error::The image answers as release $release, not $RELEASE"
            exit 1
          fi
          health="$(curl -fsS http://localhost:8789/v1/health)"
          if [ "$health" != '{"status":"ok"}' ]; then
            echo "::error::/v1/health answers $health"
            exit 1
          fi
          keys="$(curl -fsS http://localhost:8789/v1/auth/jwks | jq '.keys | length')"
          if [ "$keys" -lt 1 ]; then
            echo "::error::/v1/auth/jwks publishes no signing key"
            exit 1
          fi
      - name: Show the image's log
        if: failure()
        run: docker logs candidate || true
      - name: Push the image
        id: push
        if: github.event_name != 'pull_request'
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          if [ -z "$TAG" ]; then
            docker tag zenbujapanese-account-api:candidate "$IMAGE:sha-$RELEASE"
            docker push "$IMAGE:sha-$RELEASE" | tee push.log
            digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | cut -d' ' -f2)"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              docker tag zenbujapanese-account-api:candidate "$IMAGE:main"
              docker push --quiet "$IMAGE:main"
            fi
          else
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$TAG" |
              sed -n "s|^$IMAGE@||p" | head -n 1)"
          fi
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No digest for the image"
            exit 1
          fi
          echo "image=$IMAGE@$digest" >>"$GITHUB_OUTPUT"
          echo "Deploying $IMAGE@$digest"

  staging:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_REFERENCE: ${{ needs.image.outputs.image }}
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/account-api-deploy.yml@refs/heads/main
    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Check that main signed the image to deploy again
        if: inputs.tag != ''
        run: |
          cosign verify --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REFERENCE" >/dev/null
      - name: Sign the image
        run: cosign sign --yes "$IMAGE_REFERENCE"
      - name: Move the :staging tag to the image
        run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE:staging" "$IMAGE_REFERENCE"

  production:
    needs: [image, staging]
    if: vars.DEPLOY_PRODUCTION != 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REFERENCE: ${{ needs.image.outputs.image }}
    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the :production tag to the image
        run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE:production" "$IMAGE_REFERENCE"
