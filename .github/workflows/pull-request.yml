name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: tools/checks/pull-request.mjs
          sparse-checkout-cone-mode: false
      - name: The title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/checks/pull-request.mjs title

  issue-link:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: tools/checks/pull-request.mjs
          sparse-checkout-cone-mode: false
      - name: The pull request closes an issue, or says why it has none
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/checks/pull-request.mjs issue-link

  fix-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: tools/checks/pull-request.mjs
          sparse-checkout-cone-mode: false
      - name: A fix changes a test
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node tools/checks/pull-request.mjs fix-test
