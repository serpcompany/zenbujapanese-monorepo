name: Latest run
description: >-
  Fails a deploy job that would put old code over new. A run's first attempt always passes: a
  workflow's runs on a branch go one at a time, in order. A run started again passes only while
  no later run of its workflow on the branch has started. Needs a checkout, and permission to
  read the repository's workflow runs.
inputs:
  workflow:
    description: The workflow's file name, such as web-deploy.yml.
    required: true
  token:
    description: A token that can read the repository's workflow runs.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: node "$GITHUB_ACTION_PATH/latest-run.cjs"
