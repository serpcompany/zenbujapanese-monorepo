name: Issue251Sudachi
options:
  bundleIdPrefix: co.serp.issue251
  deploymentTarget:
    iOS: "17.0"
packages:
  Sudachi:
    path: ../sudachi-swift
targets:
  Issue251Sudachi:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Sudachi
        product: Sudachi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.serp.issue251.sudachi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
