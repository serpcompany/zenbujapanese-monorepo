project:
  name: Zenbu – Learn Japanese
  output_dir: en-US/iphone-63-marketing
  device: iPhone 17 Pro - Silver - Portrait
  output_size: iPhone6_3
defaults:
  background:
    type: linear
    colors:
    - '#FFFFFF'
    - '#FBEDEF'
    direction: 90
screenshots:
  01-search:
    content:
    - type: text
      content: Look up any word
      color: '#C60121'
      size: 96
      weight: bold
      position: ['50%', '8%']
    - type: text
      content: Japanese, English, or romaji
      color: '#212121'
      size: 52
      position: ['50%', '13%']
    - type: image
      asset: en-US/iphone-63/01-search-results.png
      frame: true
      position: ['50%', '59%']
      scale: 0.72
  02-word:
    content:
    - type: text
      content: Every detail of a word
      color: '#C60121'
      size: 96
      weight: bold
      position: ['50%', '8%']
    - type: text
      content: Meanings, pitch accent, and frequency
      color: '#212121'
      size: 52
      position: ['50%', '13%']
    - type: image
      asset: en-US/iphone-63/02-word-detail.png
      frame: true
      position: ['50%', '59%']
      scale: 0.72
  03-kanji:
    content:
    - type: text
      content: Know every kanji
      color: '#C60121'
      size: 96
      weight: bold
      position: ['50%', '8%']
    - type: text
      content: Readings, strokes, and JLPT level
      color: '#212121'
      size: 52
      position: ['50%', '13%']
    - type: image
      asset: en-US/iphone-63/03-kanji-detail.png
      frame: true
      position: ['50%', '59%']
      scale: 0.72
  04-conjugations:
    content:
    - type: text
      content: Every verb form
      color: '#C60121'
      size: 96
      weight: bold
      position: ['50%', '8%']
    - type: text
      content: Plain and polite, with how they're built
      color: '#212121'
      size: 52
      position: ['50%', '13%']
    - type: image
      asset: en-US/iphone-63/04-conjugations.png
      frame: true
      position: ['50%', '59%']
      scale: 0.72
